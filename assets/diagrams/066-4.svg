<!-- 素材: source/066_4日間閉まっていた家が警備員を全員出勤停止にした話.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s066c-title s066c-desc">
        <title id="s066c-title">警備日誌が4日間止まって全扉がロックされた事故の流れ</title>
        <desc id="s066c-desc">毎晩の日誌記入が家の4日半の閉鎖で止まり、警備システムが全扉をロックしたが、目だけで原因を突き止め、外の工務店が日誌を書いて扉が開いた6コマの物語。</desc>
        <defs>
          <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
            <feDisplacementMap in="SourceGraphic" scale="1.2"/>
          </filter>
        </defs>

        

        <g filter="url(#sketchy)">
          <!-- パネル1: 毎晩の日誌記入 -->
          <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
          <circle cx="64" cy="106" r="16" fill="var(--amber-bg)" stroke="var(--text)" stroke-width="1.2"/>
          <rect x="90" y="88" width="52" height="40" rx="4" fill="var(--amber-bg)" stroke="var(--text)" stroke-width="1.2"/>
          <line x1="98" y1="100" x2="132" y2="100" stroke="var(--text-secondary)" stroke-width="1"/>
          <line x1="98" y1="112" x2="132" y2="112" stroke="var(--text-secondary)" stroke-width="1"/>
          <line x1="146" y1="112" x2="164" y2="92" stroke="var(--text)" stroke-width="2.2"/>

          <!-- パネル2: 家が閉じる（縮小・左寄せ） -->
          <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
          <polygon points="560,78 604,112 516,112" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.4"/>
          <rect x="530" y="112" width="60" height="34" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
          <circle cx="560" cy="128" r="5" fill="var(--text)"/>
          <rect x="563" y="128" width="3" height="8" fill="var(--text)"/>
          <circle cx="618" cy="112" r="14" fill="var(--amber-bg)" stroke="var(--text)" stroke-width="1.3"/>
          <line x1="618" y1="112" x2="618" y2="103" stroke="var(--text)" stroke-width="1.4"/>
          <line x1="618" y1="112" x2="611" y2="112" stroke="var(--text)" stroke-width="1.4"/>

          <!-- パネル3: 全扉ロック -->
          <rect x="16" y="234" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
          <path d="M 58 254 l 28 -12 l 28 12 v 22 c 0 20 -28 30 -28 30 c 0 0 -28 -10 -28 -30 z" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.6"/>
          <rect x="124" y="282" width="28" height="22" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
          <path d="M 130 282 v -8 a 8 8 0 0 1 16 0 v 8" fill="none" stroke="var(--text)" stroke-width="1.3"/>

          <!-- パネル4: 目だけで捜査 -->
          <rect x="496" y="234" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
          <circle cx="566" cy="302" r="22" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.8"/>
          <line x1="582" y1="318" x2="602" y2="338" stroke="var(--text)" stroke-width="3.4"/>
          <rect x="616" y="270" width="42" height="58" rx="4" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.2"/>
          <line x1="623" y1="286" x2="650" y2="286" stroke="var(--text-secondary)" stroke-width="1"/>
          <line x1="623" y1="298" x2="650" y2="298" stroke="var(--text-secondary)" stroke-width="1"/>
          <line x1="623" y1="310" x2="644" y2="310" stroke="var(--text-secondary)" stroke-width="1"/>

          <!-- パネル5: 工務店が日誌に1行書く -->
          <rect x="16" y="404" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
          <g stroke="var(--blue)" stroke-width="2" fill="none">
            <line x1="58" y1="530" x2="58" y2="440"/>
            <line x1="58" y1="440" x2="94" y2="440"/>
            <line x1="94" y1="440" x2="94" y2="456"/>
          </g>
          <rect x="88" y="456" width="12" height="10" fill="var(--blue)"/>
          <rect x="110" y="468" width="48" height="36" rx="4" fill="var(--amber-bg)" stroke="var(--text)" stroke-width="1.2"/>
          <line x1="117" y1="480" x2="151" y2="480" stroke="var(--text-secondary)" stroke-width="1"/>
          <line x1="117" y1="492" x2="151" y2="492" stroke="var(--green)" stroke-width="2.2"/>

          <!-- パネル6: 扉が開く（イラスト帯に完結） -->
          <rect x="496" y="404" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
          <rect x="548" y="436" width="8" height="84" fill="var(--text)"/>
          <polygon points="556,436 620,448 620,520 556,520" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
          <circle cx="566" cy="478" r="3.4" fill="var(--text)"/>
          <path d="M 636 490 l 14 18 l 32 -40" fill="none" stroke="var(--green)" stroke-width="5"/>
          <g stroke="var(--amber)" stroke-width="1.8">
            <line x1="580" y1="426" x2="586" y2="416"/>
            <line x1="600" y1="422" x2="602" y2="410"/>
            <line x1="620" y1="426" x2="626" y2="418"/>
          </g>
        </g>

        <g font-family="'Noto Sans JP', sans-serif" fill="var(--text)">
          <!-- パネル1 -->
          <circle cx="48" cy="102" r="14" fill="#4f46e5"/>
          <text x="48" y="107" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
          <text x="178" y="106" font-size="16.5" font-weight="700">毎晩、警備員が日誌を書く</text>
          <text x="178" y="150" font-size="13" fill="var(--text-secondary)">決まった時刻（04:17）に、記録を一行書く。</text>
          <text x="178" y="172" font-size="13" fill="var(--text-secondary)">これが毎晩、正確に続いていた。</text>

          <!-- パネル2 -->
          <circle cx="528" cy="102" r="14" fill="#4f46e5"/>
          <text x="528" y="107" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
          <text x="652" y="106" font-size="16.5" font-weight="700">家が鍵を閉めて、出て行く</text>
          <text x="652" y="150" font-size="13" fill="var(--text-secondary)">家そのものが4日半、閉まっていた。</text>
          <text x="652" y="172" font-size="13" fill="var(--text-secondary)">時計は動いても、中の時間は止まったまま。</text>

          <!-- パネル3 -->
          <circle cx="48" cy="272" r="14" fill="#4f46e5"/>
          <text x="48" y="277" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
          <text x="164" y="276" font-size="16.5" font-weight="700">警備システムが全扉をロック</text>
          <text x="164" y="320" font-size="13" fill="var(--text-secondary)">「日誌が4日間書かれていません」——</text>
          <text x="164" y="342" font-size="13" fill="var(--text-secondary)">すべての道具が使えなくなった。</text>

          <!-- パネル4 -->
          <circle cx="528" cy="272" r="14" fill="#4f46e5"/>
          <text x="528" y="277" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
          <text x="676" y="276" font-size="16.5" font-weight="700">目だけで捜査</text>
          <text x="676" y="320" font-size="13" fill="var(--text-secondary)">「読むだけ」なら止められない。</text>
          <text x="676" y="342" font-size="13" fill="var(--text-secondary)">日誌・名簿・金庫室を読む。</text>

          <!-- パネル5 -->
          <circle cx="48" cy="442" r="14" fill="#4f46e5"/>
          <text x="48" y="447" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
          <text x="178" y="446" font-size="16.5" font-weight="700">外の工務店が日誌に1行書く</text>
          <text x="178" y="490" font-size="13" fill="var(--text-secondary)">金庫室は中にいる者には開かない。</text>
          <text x="178" y="512" font-size="13" fill="var(--text-secondary)">鍵を持つ外の工務店が、代わりに書いた。</text>

          <!-- パネル6 -->
          <circle cx="528" cy="442" r="14" fill="#4f46e5"/>
          <text x="528" y="447" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
          <text x="700" y="446" font-size="16.5" font-weight="700">扉が開く</text>
          <text x="700" y="490" font-size="13" fill="var(--text-secondary)">記録が新しくなった——扉が開いた。</text>
          <text x="700" y="512" font-size="13" fill="var(--text-secondary)">翌朝の確認の約束だけ、まだ残っている。</text>

          <!-- 脚注 -->
          <text x="480" y="576" font-size="11" fill="var(--text-secondary)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
        </g>
      </svg>