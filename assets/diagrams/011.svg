<!-- 素材: source/011_YouTubeを投げるだけで生成AI用プロンプト仕様書が出てくる話.md -->
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s011b-title s011b-desc">
  <title id="s011b-title">YouTube1本で3つの生成AI用仕様書が揃う流れ</title>
  <desc id="s011b-desc">3つの生成AIの3言語を一人で操る無理を「この曲から仕様書作って」の一言で指示書組立と別AIへの分析委任に置き換え、仕様書が構造化保存されて手癖問題が消えるまでの4段の流れ。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- 段1〜4のパネル枠 -->
    <rect x="16" y="48" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="132" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="216" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="300" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>

    <!-- 段1イラスト: 3つの言語箱が散らばる+無理の× -->
    <rect x="72" y="58" width="28" height="18" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="77" y1="67" x2="95" y2="67" stroke="var(--text-secondary)" stroke-width="1"/>
    <rect x="72" y="80" width="28" height="18" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="77" y1="89" x2="95" y2="89" stroke="var(--text-secondary)" stroke-width="1"/>
    <rect x="104" y="69" width="28" height="18" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="109" y1="78" x2="127" y2="78" stroke="var(--text-secondary)" stroke-width="1"/>
    <path d="M 142 70 l 10 10 M 152 70 l -10 10" fill="none" stroke="var(--red)" stroke-width="2"/>

    <!-- 段2イラスト: 発話の吹き出し（人+「この曲から仕様書作って」） -->
    <circle cx="80" cy="160" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 64 190 Q 80 174 96 190" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="98" y="150" width="152" height="30" rx="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 106 180 L 94 194 L 130 180" fill="none" stroke="var(--text)" stroke-width="1.3"/>

    <!-- 段3イラスト: 仕様書の紙から保存箱へ -->
    <rect x="72" y="232" width="34" height="40" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="78" y1="244" x2="98" y2="244" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="78" y1="252" x2="94" y2="252" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="78" y1="260" x2="98" y2="260" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="110" y1="252" x2="124" y2="252" stroke="var(--text)" stroke-width="1.6"/>
    <polygon points="124,248 124,256 132,252" fill="var(--text)"/>
    <rect x="136" y="238" width="30" height="28" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="142" y1="248" x2="160" y2="248" stroke="var(--accent-dark)" stroke-width="1"/>
    <line x1="142" y1="258" x2="156" y2="258" stroke="var(--accent-dark)" stroke-width="1"/>

    <!-- 段4イラスト: 3つの翻訳済出力+緑チェック -->
    <rect x="72" y="330" width="26" height="24" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="77" y1="342" x2="93" y2="342" stroke="var(--accent-dark)" stroke-width="1"/>
    <rect x="102" y="330" width="26" height="24" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="107" y1="342" x2="123" y2="342" stroke="var(--accent-dark)" stroke-width="1"/>
    <rect x="132" y="330" width="26" height="24" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="137" y1="342" x2="153" y2="342" stroke="var(--accent-dark)" stroke-width="1"/>
    <path d="M 172 334 l 7 7 l 14 -16" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数）+ 段4緑チェック -->
  <circle cx="48" cy="81" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="165" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="249" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="333" r="16" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <path d="M 41 333 l 5 5 l 9 -11" fill="none" stroke="var(--text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="'Noto Sans JP', sans-serif">
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="86">1</text>
      <text x="48" y="170">2</text>
      <text x="48" y="254">3</text>
    </g>

    <!-- 段2の発話（吹き出し内・accent-bg変数の上にaccent-dark変数） -->
    <text x="174" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent-dark)">この曲から仕様書作って</text>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="260" y="78">3つのAIの3言語を一人で操る無理</text>
      <text x="260" y="162">「この曲から仕様書作って」を投げる</text>
      <text x="260" y="246">仕様書が返り構造化して保存される</text>
      <text x="260" y="330">3つの翻訳済言語が一度に手に入る</text>
    </g>

    <!-- 説明（1行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="260" y="98">音像移植にStyle・構図・カメラの設計が必要。</text>
      <text x="260" y="182">指示書にURLを埋めて別AIへ分析委任。</text>
      <text x="260" y="266">Style・構図3パターン・カメラ指示が揃う。</text>
      <text x="260" y="350">手癖の同じ構図ばかり問題が消えて広がる。</text>
    </g>
  </g>
</svg>
