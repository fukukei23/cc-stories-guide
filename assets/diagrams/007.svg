<!-- 素材: source/007_今夜はミニマックスと言ったら裏側のレート制限を切り替えてくれる話.md -->
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s007b-title s007b-desc">
  <title id="s007b-title">「今夜はミニマックス」一言で裏側が軽い側へ切替わる流れ</title>
  <desc id="s007b-desc">週半ばの重さを「今夜はミニマックス」の一言で裏側のプロキシが時刻指定切替し、話しかけ方は同じまま軽い側で動き続けられるまでの4段の流れ。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- 段1〜4のパネル枠 -->
    <rect x="16" y="48" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="132" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="216" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="300" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>

    <!-- 段1イラスト: 残りわずかの電池+重さの矢印 -->
    <rect x="76" y="64" width="42" height="22" rx="3" fill="none" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="118" y="70" width="4" height="10" fill="var(--text)"/>
    <rect x="80" y="68" width="10" height="14" fill="var(--amber)"/>
    <line x1="88" y1="94" x2="88" y2="102" stroke="var(--red)" stroke-width="2"/>
    <polygon points="84,100 92,100 88,108" fill="var(--red)"/>

    <!-- 段2イラスト: 発話の吹き出し（人+「今夜はミニマックス」） -->
    <circle cx="88" cy="160" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 72 190 Q 88 174 104 190" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="108" y="150" width="126" height="30" rx="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 116 180 L 104 194 L 144 180" fill="none" stroke="var(--text)" stroke-width="1.3"/>

    <!-- 段3イラスト: プロバイダ切替（今の箱→軽い箱+緑チェック） -->
    <rect x="72" y="228" width="30" height="26" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="78" y1="241" x2="96" y2="241" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="106" y1="241" x2="138" y2="241" stroke="var(--text)" stroke-width="1.6" stroke-dasharray="4 3"/>
    <polygon points="138,237 138,245 146,241" fill="var(--text)"/>
    <rect x="146" y="228" width="30" height="26" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="152" y1="241" x2="170" y2="241" stroke="var(--accent-dark)" stroke-width="1"/>
    <path d="M 154 224 l 4 4 l 8 -8" fill="none" stroke="var(--green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 段4イラスト: statusで軽さを確認（画面枠+緑チェック） -->
    <rect x="72" y="318" width="56" height="32" rx="4" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="78" y1="328" x2="118" y2="328" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="78" y1="338" x2="104" y2="338" stroke="var(--text-secondary)" stroke-width="1"/>
    <path d="M 138 328 l 8 8 l 16 -18" fill="none" stroke="var(--green)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数）+ 段4緑チェック -->
  <circle cx="48" cy="81" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="165" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="249" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="333" r="16" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <path d="M 41 333 l 5 5 l 9 -11" fill="none" stroke="var(--text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="'Noto Sans JP', sans-serif">
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="86">1</text>
      <text x="48" y="170">2</text>
      <text x="48" y="254">3</text>
    </g>

    <!-- 段2の発話（吹き出し内・accent-bg変数の上にaccent-dark変数） -->
    <text x="171" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent-dark)">今夜はミニマックス</text>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="260" y="78">週半ばからLLMが重く感じる</text>
      <text x="260" y="162">「今夜はミニマックス」と一言</text>
      <text x="260" y="246">裏側のプロキシが静かに切替える</text>
      <text x="260" y="330">声を出すだけで世界が軽くなる</text>
    </g>

    <!-- 説明（1行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="260" y="98">枠が足りない日、長文や複雑な生成が遅い。</text>
      <text x="260" y="182">時刻指定で明朝6時まで自動で切り替わる。</text>
      <text x="260" y="266">話しかけ方は同じまま裏だけ軽い側へ。</text>
      <text x="260" y="350">statusで残枠と回復時刻まで読める。</text>
    </g>
  </g>
</svg>
