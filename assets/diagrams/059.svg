<!-- 素材: source/059_外部ツールのインストーラが中枢設定を勝手に書こうとした話.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s059a-title s059a-desc">
  <title id="s059a-title">インストーラの勝手な書込みを見張りの層が止めた流れ</title>
  <desc id="s059a-desc">外部の診断ツールのインストーラが中枢設定へフック登録を書こうとしたが仕込んであった見張りのフックがTOKEN検知で自動復元し、書込み内容と混入ゼロと道具単体動作の三段確認を経て積んできた防御の層がはじめて実戦で機能した6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 導入の箱と下矢印 -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="92" y="102" width="56" height="36" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="92" y1="114" x2="148" y2="114" stroke="var(--text)" stroke-width="1"/>
    <line x1="120" y1="86" x2="120" y2="94" stroke="var(--amber)" stroke-width="2"/>
    <polygon points="116,93 124,93 120,100" fill="var(--amber)"/>

    <!-- パネル2: ターミナルのログ -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="556" y="88" width="96" height="48" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="556" y1="100" x2="652" y2="100" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="562" y1="110" x2="608" y2="110" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="562" y1="118" x2="624" y2="118" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="562" y1="126" x2="616" y2="126" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="624" y1="126" x2="644" y2="126" stroke="var(--green)" stroke-width="1.8"/>

    <!-- パネル3: 中枢設定と鍵 -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="80" y="282" width="44" height="40" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="102" cy="302" r="10" fill="none" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="102" cy="302" r="4" fill="none" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="138" cy="290" r="5" fill="none" stroke="var(--text)" stroke-width="1.8"/>
    <line x1="143" y1="290" x2="156" y2="290" stroke="var(--text)" stroke-width="2.2"/>
    <line x1="150" y1="290" x2="150" y2="295" stroke="var(--text)" stroke-width="1.8"/>
    <line x1="80" y1="332" x2="128" y2="332" stroke="var(--red)" stroke-width="2"/>

    <!-- パネル4: 盾と戻す矢印 -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 580 280 L 606 280 L 606 304 Q 606 320 593 326 Q 580 320 580 304 Z" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.5"/>
    <path d="M 587 300 l 5 5 l 9 -11" fill="none" stroke="var(--accent-dark)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="646" y1="296" x2="620" y2="296" stroke="var(--text)" stroke-width="1.8"/>
    <polygon points="622,292 622,300 614,296" fill="var(--text)"/>

    <!-- パネル5: 三段確認のチェックリスト -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="84" cy="422" r="6" fill="none" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 81 422 l 3 3 l 5 -6" fill="none" stroke="var(--green)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="96" y1="422" x2="134" y2="422" stroke="var(--text-secondary)" stroke-width="1.2"/>
    <circle cx="84" cy="444" r="6" fill="none" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 81 444 l 3 3 l 5 -6" fill="none" stroke="var(--green)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="96" y1="444" x2="128" y2="444" stroke="var(--text-secondary)" stroke-width="1.2"/>
    <circle cx="84" cy="466" r="6" fill="none" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 81 466 l 3 3 l 5 -6" fill="none" stroke="var(--green)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="96" y1="466" x2="132" y2="466" stroke="var(--text-secondary)" stroke-width="1.2"/>

    <!-- パネル6: 積まれた防御の層 -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="556" y="416" width="64" height="14" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="562" y="434" width="64" height="14" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="568" y="452" width="64" height="14" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <path d="M 632 440 l 5 5 l 9 -11" fill="none" stroke="var(--green)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">診断ツールの導入を開始</text>
      <text x="658" y="106">ログに勝手な登録の跡</text>
      <text x="178" y="272">中枢設定に認証キー集約</text>
      <text x="658" y="272">見張りが自動で跳ね返す</text>
      <text x="178" y="438">書込み内容を三段で確認</text>
      <text x="658" y="438">積んだ層が実戦で初機能</text>
    </g>

    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">インストールコマンド実行。</text>
      <text x="178" y="172">外から持ってきた道具。</text>
      <text x="658" y="150">フックを登録した行が出る。</text>
      <text x="658" y="172">Done!表示で内容は不明。</text>
      <text x="178" y="316">外の道具が書けるのは危険。</text>
      <text x="178" y="338">晒しかけ事故の前例あり。</text>
      <text x="658" y="316">TOKEN検知で自動で元に戻す。</text>
      <text x="658" y="338">書込みは一瞬も無効。</text>
      <text x="178" y="482">何を書いたか・混入ゼロ照合。</text>
      <text x="178" y="504">道具単体の動作も実測。</text>
      <text x="658" y="482">何も起きないは防御の記録。</text>
      <text x="658" y="504">次の実証の日になる。</text>
    </g>

    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
