<!-- 素材: source/060_AIが作った検査機械は本番投入前に人間が30件採点する話.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s060a-title s060a-desc">
  <title id="s060a-title">作った本人でなく人間の採点が昇格を決める流れ</title>
  <desc id="s060a-desc">AIに作らせた検査機械の誤発火に対し本人の自信でなく本番投入の条件を採点の点数へ変え、お試し期間の裏記録から30件を人間が採点して三つの率で合格点を判定し点数が門を通れば本番へ上げる形にした6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 誤発火の警報ベル -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 88 122 A 20 20 0 0 1 128 122" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="84" y1="122" x2="132" y2="122" stroke="var(--text)" stroke-width="1.6"/>
    <line x1="108" y1="102" x2="108" y2="96" stroke="var(--text)" stroke-width="2"/>
    <path d="M 78 108 q -8 8 0 16" fill="none" stroke="var(--red)" stroke-width="1.6"/>
    <path d="M 138 108 q 8 8 0 16" fill="none" stroke="var(--red)" stroke-width="1.6"/>

    <!-- パネル2: 自己採点の紙と× -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="560" y="88" width="48" height="40" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="568" y1="100" x2="600" y2="100" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="568" y1="110" x2="592" y2="110" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="616" y1="92" x2="616" y2="122" stroke="var(--amber)" stroke-width="2.4"/>
    <polygon points="613,122 619,122 616,128" fill="var(--amber)"/>
    <path d="M 636 96 l 12 12 M 648 96 l -12 12" fill="none" stroke="var(--red)" stroke-width="2"/>

    <!-- パネル3: 本番と影の二台 -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="76" y="284" width="44" height="36" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 90 302 l 5 5 l 9 -11" fill="none" stroke="var(--green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="120" y1="302" x2="130" y2="302" stroke="var(--text-secondary)" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="130" y="284" width="44" height="36" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <line x1="138" y1="298" x2="166" y2="298" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="138" y1="308" x2="160" y2="308" stroke="var(--text-secondary)" stroke-width="1"/>

    <!-- パネル4: 記録の束と採点 -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="556" y="276" width="36" height="44" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="562" y="282" width="36" height="44" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="568" y="288" width="36" height="44" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="622" cy="298" r="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.8"/>
    <line x1="638" y1="284" x2="638" y2="312" stroke="var(--text)" stroke-width="2"/>
    <polygon points="635,312 641,312 638,318" fill="var(--text)"/>

    <!-- パネル5: 三つの門と全チェック -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="76" y="424" width="24" height="36" fill="none" stroke="var(--green)" stroke-width="1.8"/>
    <path d="M 82 440 l 4 4 l 7 -9" fill="none" stroke="var(--green)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="110" y="424" width="24" height="36" fill="none" stroke="var(--green)" stroke-width="1.8"/>
    <path d="M 116 440 l 4 4 l 7 -9" fill="none" stroke="var(--green)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="144" y="424" width="24" height="36" fill="none" stroke="var(--green)" stroke-width="1.8"/>
    <path d="M 150 440 l 4 4 l 7 -9" fill="none" stroke="var(--green)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- パネル6: 昇格の階段矢印と本番の門 -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 552 488 L 574 488 L 574 468 L 596 468 L 596 448" fill="none" stroke="var(--amber)" stroke-width="2.4"/>
    <polygon points="592,448 600,448 596,440" fill="var(--amber)"/>
    <rect x="614" y="442" width="26" height="34" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.5"/>
    <path d="M 621 458 l 4 4 l 8 -10" fill="none" stroke="var(--accent-dark)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">AIに検査機械を作らせた</text>
      <text x="658" y="106">本人の自信は証明にならない</text>
      <text x="178" y="272">お試し期間で裏記録だけ取る</text>
      <text x="658" y="272">30件を人間が一枚ずつ採点</text>
      <text x="178" y="438">三つの率で合格点を判定</text>
      <text x="658" y="438">点数が門を通れば本番へ</text>
    </g>

    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">出来上がりは誤発火連発。</text>
      <text x="178" y="172">一日十回は止められた。</text>
      <text x="658" y="150">聞くのは作った本人自身。</text>
      <text x="658" y="172">自己採点に証拠はない。</text>
      <text x="178" y="316">本番検査はそのまま稼働。</text>
      <text x="178" y="338">新判定は黙って記録のみ。</text>
      <text x="658" y="316">三つの率を一枚ずつ出す。</text>
      <text x="658" y="338">期間は14〜60日で。</text>
      <text x="178" y="482">誤止5%以下・見逃し10%以下。</text>
      <text x="178" y="504">正判定は80%以上。</text>
      <text x="658" y="482">通らなければ手直し再試験。</text>
      <text x="658" y="504">自己申告の世界は終わり。</text>
    </g>

    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
