<!-- 素材: source/003_おはようと言って昨日が戻ってくる話.md -->
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s003b-title s003b-desc">
  <title id="s003b-title">「おはよう」の一言で朝の再開が終わる流れ</title>
  <desc id="s003b-desc">毎朝の昨日の続き探しの5分ロスから、「おはよう」と一言投げると最新5件の引き継ぎまとめが順に読まれ、朝イチで昨日の続きから再開できるまでの4段の流れ。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- 段1〜4のパネル枠 -->
    <rect x="16" y="48" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="132" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="216" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="300" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>

    <!-- 段1イラスト: 帳をひっくり返して探す（散らばる帳3枚+虫眼鏡） -->
    <rect x="76" y="62" width="30" height="40" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="82" y1="74" x2="100" y2="74" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="82" y1="86" x2="96" y2="86" stroke="var(--text-secondary)" stroke-width="1"/>
    <rect x="112" y="74" width="30" height="36" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="118" y1="86" x2="136" y2="86" stroke="var(--text-secondary)" stroke-width="1"/>
    <rect x="148" y="60" width="30" height="40" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="154" y1="72" x2="172" y2="72" stroke="var(--text-secondary)" stroke-width="1"/>
    <circle cx="200" cy="84" r="14" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.6"/>
    <line x1="211" y1="95" x2="223" y2="107" stroke="var(--text)" stroke-width="2.4"/>

    <!-- 段2イラスト: 発話の吹き出し（人+「おはよう」の吹き出し） -->
    <circle cx="88" cy="155" r="13" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 72 186 Q 88 170 104 186" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="108" y="144" width="112" height="32" rx="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 116 176 L 104 190 L 132 176" fill="none" stroke="var(--text)" stroke-width="1.3"/>

    <!-- 段3イラスト: 最新5件のまとめを上から順に読む（メモ4枚縦+下向き矢印） -->
    <rect x="76" y="224" width="104" height="10" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="76" y="238" width="104" height="10" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="76" y="252" width="104" height="10" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="76" y="266" width="104" height="10" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="198" y1="224" x2="198" y2="268" stroke="var(--accent)" stroke-width="1.8"/>
    <polygon points="192,264 204,264 198,274" fill="var(--accent)"/>

    <!-- 段4イラスト: 昨日のタブから今日のタブへ続きから再開 -->
    <rect x="76" y="314" width="64" height="40" rx="5" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="84" y1="328" x2="124" y2="328" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="84" y1="338" x2="116" y2="338" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="144" y1="334" x2="168" y2="334" stroke="var(--text)" stroke-width="1.8"/>
    <polygon points="168,330 168,338 176,334" fill="var(--text)"/>
    <rect x="180" y="314" width="58" height="40" rx="5" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.3"/>
    <line x1="188" y1="328" x2="228" y2="328" stroke="var(--green)" stroke-width="1.2"/>
    <line x1="188" y1="338" x2="216" y2="338" stroke="var(--green)" stroke-width="1.2"/>
  </g>

  <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数）+ 段4緑チェック -->
  <circle cx="48" cy="81" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="165" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="249" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="333" r="16" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <path d="M 41 333 l 5 5 l 9 -11" fill="none" stroke="var(--text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="'Noto Sans JP', sans-serif">
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="86">1</text>
      <text x="48" y="170">2</text>
      <text x="48" y="254">3</text>
    </g>

    <!-- 段2の発話（吹き出し内・accent-bg変数の上にaccent-dark変数） -->
    <text x="164" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent-dark)">おはよう</text>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="260" y="78">毎朝、昨日の続きを探す手間</text>
      <text x="260" y="162">一言で昨日の自分を呼び戻す</text>
      <text x="260" y="246">最新5件のまとめを順に読む</text>
      <text x="260" y="330">朝の思い出し5分がゼロに</text>
    </g>

    <!-- 説明（1行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="260" y="98">ファイルをひっくり返し思い出しに5分ロス。</text>
      <text x="260" y="182">「おはよう」「再開」「restart」と投げる。</text>
      <text x="260" y="266">スキルがhandoffを読み地図を渡す。</text>
      <text x="260" y="350">昨日の考えを引き受けてすぐ再開できる。</text>
    </g>
  </g>
</svg>
