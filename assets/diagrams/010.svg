<!-- 素材: source/010_dev-cycleと呼ぶと開発のサイクルが一巡する話.md -->
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s010b-title s010b-desc">
  <title id="s010b-title">「dev-cycle」一言で品質改善の5フェーズが一巡する流れ</title>
  <desc id="s010b-desc">積み上がった品質の懸念を「dev-cycle」の一言で受け入れ条件付きの5フェーズが一巡し、人間は妥当性チェックと承認だけに集中できるまでの4段の流れ。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- 段1〜4のパネル枠 -->
    <rect x="16" y="48" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="132" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="216" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="300" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>

    <!-- 段1イラスト: 積み上がる課題+放置の× -->
    <rect x="84" y="56" width="36" height="14" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="84" y="74" width="36" height="14" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="84" y="92" width="36" height="14" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <path d="M 130 68 l 10 10 M 140 68 l -10 10" fill="none" stroke="var(--red)" stroke-width="2.2"/>

    <!-- 段2イラスト: 発話の吹き出し（人+「dev-cycle」） -->
    <circle cx="88" cy="160" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 72 190 Q 88 174 104 190" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="108" y="150" width="110" height="30" rx="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 116 180 L 104 194 L 140 180" fill="none" stroke="var(--text)" stroke-width="1.3"/>

    <!-- 段3イラスト: 5フェーズの一巡（丸5つを順に結ぶ+緑チェック） -->
    <line x1="72" y1="246" x2="164" y2="246" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="76" cy="246" r="6" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1"/>
    <circle cx="96" cy="246" r="6" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1"/>
    <circle cx="116" cy="246" r="6" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1"/>
    <circle cx="136" cy="246" r="6" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1"/>
    <circle cx="156" cy="246" r="6" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1"/>
    <path d="M 172 238 l 6 6 l 12 -14" fill="none" stroke="var(--green)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 段4イラスト: 人の承認（人+承認チェック箱） -->
    <circle cx="84" cy="326" r="11" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 70 354 Q 84 340 98 354" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="110" y="320" width="26" height="26" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <path d="M 116 333 l 4 4 l 8 -9" fill="none" stroke="var(--green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数）+ 段4緑チェック -->
  <circle cx="48" cy="81" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="165" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="249" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="333" r="16" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <path d="M 41 333 l 5 5 l 9 -11" fill="none" stroke="var(--text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="'Noto Sans JP', sans-serif">
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="86">1</text>
      <text x="48" y="170">2</text>
      <text x="48" y="254">3</text>
    </g>

    <!-- 段2の発話（吹き出し内・accent-bg変数の上にaccent-dark変数） -->
    <text x="163" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">dev-cycle</text>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="260" y="78">品質の懸念が溜まって放置される</text>
      <text x="260" y="162">「dev-cycle」と呼ぶだけ</text>
      <text x="260" y="246">点検から完了通知まで自動で一巡</text>
      <text x="260" y="330">人は妥当性チェックと承認に集中</text>
    </g>

    <!-- 説明（1行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="260" y="98">どこから直すか分からず「いつかやる」に。</text>
      <text x="260" y="182">5フェーズが受け入れ条件付きで回る。</text>
      <text x="260" y="266">各段の成果が次への入力になりバトン接続。</text>
      <text x="260" y="350">放置PJが1日1サイクルで鮮度を保つ。</text>
    </g>
  </g>
</svg>
