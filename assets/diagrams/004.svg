<!-- 素材: source/004_歌詞だけじゃなくて音も数え始めた話.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s004c-title s004c-desc">
  <title id="s004c-title">文字満点でも音を実測して曲を確かめた流れ</title>
  <desc id="s004c-desc">歌詞の文字点数は満点でもモノトーンな曲が混じったため、音源そのものを解析して文字と音を半々で評価し、鳴らして確かめる方式に変えた6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 文字の点数は満点なのに（歌詞カード+満点マーク） -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="88" y="96" width="44" height="56" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="94" y1="108" x2="126" y2="108" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="94" y1="120" x2="126" y2="120" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="94" y1="132" x2="120" y2="132" stroke="var(--text-secondary)" stroke-width="1"/>
    <circle cx="158" cy="122" r="14" fill="var(--accent-bg)" stroke="var(--accent-dark)" stroke-width="1.4"/>
    <path d="M 151 122 l 4 4 l 9 -10" fill="none" stroke="var(--accent-dark)" stroke-width="2.4"/>

    <!-- パネル2: 高音を頼んだのに低いまま（低い棒列+上向き矢印） -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="566" y1="188" x2="566" y2="170" stroke="var(--text)" stroke-width="3"/>
    <line x1="580" y1="188" x2="580" y2="166" stroke="var(--text)" stroke-width="3"/>
    <line x1="594" y1="188" x2="594" y2="172" stroke="var(--text)" stroke-width="3"/>
    <line x1="608" y1="188" x2="608" y2="168" stroke="var(--text)" stroke-width="3"/>
    <line x1="622" y1="188" x2="622" y2="171" stroke="var(--text)" stroke-width="3"/>
    <line x1="636" y1="188" x2="636" y2="167" stroke="var(--text)" stroke-width="3"/>
    <path d="M 590 146 l 13 13 M 603 146 l -13 13" fill="none" stroke="var(--red)" stroke-width="2.4"/>

    <!-- パネル3: 原因は文字しか見ていないこと（帳の下に隠れた音波） -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="96" y="262" width="40" height="50" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="102" y1="274" x2="130" y2="274" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="102" y1="286" x2="130" y2="286" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="102" y1="298" x2="124" y2="298" stroke="var(--text-secondary)" stroke-width="1"/>
    <path d="M 146 306 l 6 -6 l 6 6 l 6 -6" fill="none" stroke="var(--blue)" stroke-width="2"/>
    <path d="M 100 330 l 14 14 M 114 330 l -14 14" fill="none" stroke="var(--red)" stroke-width="2.4"/>

    <!-- パネル4: 音源そのものを解析する（波形+虫メガネ） -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="566" y1="356" x2="566" y2="310" stroke="var(--blue)" stroke-width="3"/>
    <line x1="580" y1="356" x2="580" y2="300" stroke="var(--blue)" stroke-width="3"/>
    <line x1="594" y1="356" x2="594" y2="322" stroke="var(--blue)" stroke-width="3"/>
    <line x1="608" y1="356" x2="608" y2="292" stroke="var(--blue)" stroke-width="3"/>
    <line x1="622" y1="356" x2="622" y2="306" stroke="var(--blue)" stroke-width="3"/>
    <line x1="636" y1="356" x2="636" y2="296" stroke="var(--blue)" stroke-width="3"/>
    <circle cx="594" cy="274" r="12" fill="none" stroke="var(--text)" stroke-width="1.8"/>
    <line x1="603" y1="283" x2="614" y2="294" stroke="var(--text)" stroke-width="2.6"/>

    <!-- パネル5: 文字と音を半々で評価（2つの円+真ん中のチェック） -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="106" cy="474" r="24" fill="var(--accent-bg)" stroke="var(--accent-dark)" stroke-width="1.4"/>
    <circle cx="146" cy="474" r="24" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.4"/>
    <rect x="112" y="470" width="28" height="9" fill="var(--bg-card)" stroke="none"/>
    <path d="M 114 478 l 6 6 l 12 -14" fill="none" stroke="var(--green)" stroke-width="3"/>

    <!-- パネル6: 鳴らして確かめる方式へ（スピーカー+音波+チェック） -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <polygon points="566,466 582,466 596,452 596,494 582,480 566,480" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 606 462 a 14 14 0 0 1 0 24" fill="none" stroke="var(--green)" stroke-width="2"/>
    <path d="M 614 454 a 24 24 0 0 1 0 40" fill="none" stroke="var(--green)" stroke-width="2"/>
    <path d="M 646 462 l 6 6 l 13 -15" fill="none" stroke="var(--green)" stroke-width="3"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数・両テーマ4.5:1以上） -->
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">文字の点数は満点なのに</text>
      <text x="658" y="106">高音を頼んだのに低いまま</text>
      <text x="178" y="272">原因は文字しか見ていないこと</text>
      <text x="658" y="272">音源そのものを解析する</text>
      <text x="178" y="438">文字と音を半々で評価</text>
      <text x="658" y="438">鳴らして確かめる方式へ</text>
    </g>

    <!-- キャプション（2行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">音節・言葉・行の長さを数えて合格。</text>
      <text x="178" y="172">全部、文字を見て数えていた。</text>
      <text x="658" y="150">いざ鳴らすとモノトーンな曲が混じる。</text>
      <text x="658" y="172">耳は不合格と言っている。</text>
      <text x="178" y="316">音の高さを誰も確かめていなかった。</text>
      <text x="178" y="338">言葉の有無だけで合格していた。</text>
      <text x="658" y="316">音の高さの平均位置を測る。</text>
      <text x="658" y="338">本当に中高音を使っているか分かる。</text>
      <text x="178" y="482">音程のゆれ幅も実測して加える。</text>
      <text x="178" y="504">設計と実測の二枚で判定する。</text>
      <text x="658" y="482">手詰まりが消えた。</text>
      <text x="658" y="504">地味な歌詞でもよく響く曲が見つかる。</text>
    </g>

    <!-- 脚注（ページ背景の上に載るためtext変数） -->
    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
