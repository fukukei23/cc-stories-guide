<!-- 素材: source/024_SSOTから探してと言ったら過去の失敗を掘り返してきた話.md -->
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s024b-title s024b-desc">
  <title id="s024b-title">「SSOTから探して」一言で過去の経緯と失敗条件まで掘り返してくる流れ</title>
  <desc id="s024b-desc">解決済みの問題が形を変えて戻る問題を「SSOTから探して」の一言で記録庫の横断検索をかけ、課題の言葉で経緯・なぜそうしたか・失敗条件まで提示し同じ轍を二度踏まなくなるまでの4段の流れ。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- 段1〜4のパネル枠 -->
    <rect x="16" y="48" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="132" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="216" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="300" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>

    <!-- 段1イラスト: 記録の山+形を変えて戻る問題のループ矢印 -->
    <rect x="70" y="82" width="26" height="16" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="100" y="76" width="26" height="16" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="130" y="70" width="26" height="16" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="160" y="64" width="26" height="16" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="190" y="70" width="26" height="16" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <path d="M 203 100 Q 178 122 148 96" fill="none" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="152,92 144,92 148,102" fill="var(--red)"/>

    <!-- 段2イラスト: 人+「SSOTから探して」吹き出し -->
    <circle cx="88" cy="160" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 72 190 Q 88 174 104 190" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="108" y="150" width="122" height="30" rx="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 116 180 L 104 194 L 144 180" fill="none" stroke="var(--text)" stroke-width="1.3"/>

    <!-- 段3イラスト: 記録庫の棚2段+検索の拡大鏡 -->
    <rect x="66" y="226" width="64" height="48" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="66" y1="250" x2="130" y2="250" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="76" y1="232" x2="104" y2="232" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="76" y1="242" x2="110" y2="242" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="76" y1="262" x2="112" y2="262" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="76" y1="270" x2="100" y2="270" stroke="var(--text-secondary)" stroke-width="1"/>
    <circle cx="146" cy="256" r="12" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.8"/>
    <line x1="155" y1="265" x2="166" y2="276" stroke="var(--text)" stroke-width="3"/>

    <!-- 段4イラスト: やめた方法の再試行を×で阻止+発見の緑チェック -->
    <rect x="74" y="322" width="28" height="24" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="110" y1="334" x2="130" y2="334" stroke="var(--text)" stroke-width="1.6"/>
    <polygon points="130,330 130,338 138,334" fill="var(--text)"/>
    <rect x="140" y="322" width="28" height="24" rx="3" fill="none" stroke="var(--red)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <path d="M 146 328 l 12 12 M 158 328 l -12 12" fill="none" stroke="var(--red)" stroke-width="2.2"/>
    <path d="M 184 328 l 8 8 l 16 -18" fill="none" stroke="var(--green)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数）+ 段4緑チェック -->
  <circle cx="48" cy="81" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="165" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="249" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="333" r="16" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <path d="M 41 333 l 5 5 l 9 -11" fill="none" stroke="var(--text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="'Noto Sans JP', sans-serif">
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="86">1</text>
      <text x="48" y="170">2</text>
      <text x="48" y="254">3</text>
    </g>

    <!-- 段2の発話（吹き出し内・accent-bg変数の上にaccent-dark変数） -->
    <text x="169" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent-dark)">SSOTから探して</text>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="260" y="78">解決済みの問題が形を変えて戻る</text>
      <text x="260" y="162">「SSOTから探して」と一言投げる</text>
      <text x="260" y="246">課題の言葉で横断検索が走る</text>
      <text x="260" y="330">同じ轍を二度踏まなくなる</text>
    </g>

    <!-- 説明（1行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="260" y="98">記録は山ほどあるのに必要な瞬間に引き出せない。</text>
      <text x="260" y="182">「過去の決定を探して」でも同じく動く。</text>
      <text x="260" y="266">技術名でなく課題の名前で経緯と失敗条件まで出る。</text>
      <text x="260" y="350">やめたはずの方法の再採用が構造的に起きなくなる。</text>
    </g>
  </g>
</svg>
