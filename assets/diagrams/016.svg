<!-- 素材: source/016_AI審査員の盲点を人間の一言と説明書の改良で塞いだ話.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s016a-title s016a-desc">
  <title id="s016a-title">3体AI審査の盲点を人間の一言と説明書の2行追加で塞いだ流れ</title>
  <desc id="s016a-desc">39件の的確な指摘の裏に未テスト領域の盲点があり、人間の「テストは充分？」一言で露出させ、説明書に観点と渡し物の2行と行数警告を足して塞いだ6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 道具を作り3体AIに審査を頼む（道具箱+AI丸3体+依頼線） -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="78" y="84" width="32" height="26" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="84" y1="92" x2="104" y2="92" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="84" y1="101" x2="104" y2="101" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="94" y1="110" x2="112" y2="128" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="100" y1="110" x2="134" y2="132" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="106" y1="110" x2="156" y2="134" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="98" cy="152" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="130" cy="154" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="160" cy="150" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>

    <!-- パネル2: 39件の指摘で一見十分（紙束3枚+指摘の山線） -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="566" y="84" width="42" height="54" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="572" y="78" width="42" height="54" rx="3" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="578" y="72" width="42" height="54" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="584" y1="86" x2="614" y2="86" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="584" y1="96" x2="614" y2="96" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="584" y1="106" x2="610" y2="106" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="630" y1="118" x2="646" y2="104" stroke="var(--accent-dark)" stroke-width="2.2"/>

    <!-- パネル3: 人間の一言「テストは充分?」（人+吹き出し） -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="70" cy="304" r="11" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 54 332 Q 70 316 86 332" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="86" y="288" width="78" height="28" rx="9" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 94 316 L 82 330 L 118 316" fill="none" stroke="var(--text)" stroke-width="1.3"/>

    <!-- パネル4: 未テスト領域を誰も見ていなかった（点線の空箱3つ） -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="548" y="270" width="30" height="34" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="586" y="270" width="30" height="34" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="624" y="270" width="30" height="34" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <path d="M 660 296 l 10 10 M 670 296 l -10 10" fill="none" stroke="var(--red)" stroke-width="2.2"/>

    <!-- パネル5: 説明書に観点と渡し物を足す（説明書+追加2行強調+加算印） -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="86" y="418" width="52" height="68" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="92" y1="432" x2="132" y2="432" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="92" y1="466" x2="132" y2="466" stroke="var(--accent-dark)" stroke-width="2.2"/>
    <line x1="92" y1="478" x2="132" y2="478" stroke="var(--accent-dark)" stroke-width="2.2"/>
    <line x1="142" y1="452" x2="152" y2="452" stroke="var(--text)" stroke-width="2"/>
    <line x1="147" y1="447" x2="147" y2="457" stroke="var(--text)" stroke-width="2"/>

    <!-- パネル6: 行数警告の見張り役が再発を防ぐ（モニタ+警告帯） -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="548" y="424" width="66" height="48" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="554" y="430" width="54" height="36" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1"/>
    <rect x="554" y="448" width="54" height="18" fill="var(--amber-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="560" y1="457" x2="568" y2="457" stroke="var(--text)" stroke-width="2"/>
    <line x1="574" y1="457" x2="600" y2="457" stroke="var(--text)" stroke-width="1"/>
    <line x1="566" y1="410" x2="568" y2="402" stroke="var(--amber)" stroke-width="1.8"/>
    <line x1="584" y1="406" x2="586" y2="398" stroke="var(--amber)" stroke-width="1.8"/>
    <path d="M 628 470 l 12 12 l 26 -30" fill="none" stroke="var(--green)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数・両テーマ4.5:1以上） -->
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <!-- パネル3の吹き出し内テキスト（accent-bg変数の上にaccent-dark変数） -->
    <text x="125" y="307" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent-dark)">テストは充分?</text>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">道具を作り3体AIに審査を頼む</text>
      <text x="658" y="106">39件の指摘で一見十分</text>
      <text x="178" y="272">人間の一言が盲点を掘り起こす</text>
      <text x="658" y="272">未テスト領域を誰も見ていなかった</text>
      <text x="178" y="438">説明書に観点と渡し物を足す</text>
      <text x="658" y="438">行数警告の見張り役が再発を防ぐ</text>
    </g>

    <!-- キャプション（2行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">渡したのは変更した一部分だけ。</text>
      <text x="178" y="172">見える範囲が最初から限られていた。</text>
      <text x="658" y="150">的確で「これで十分」に見えた。</text>
      <text x="658" y="172">三体とも頼まれた範囲で優秀だった。</text>
      <text x="178" y="316">「テストは充分？」のたった1問。</text>
      <text x="178" y="338">頼まれていないことは誰もやらない。</text>
      <text x="658" y="316">表示・警告行・分岐の3領域。</text>
      <text x="658" y="338">三人で合計ゼロ件だった。</text>
      <text x="178" y="482">未テスト部分を挙げよの1行。</text>
      <text x="178" y="504">全体とテスト一式を渡せの1行。</text>
      <text x="658" y="482">五百五十行超えたら画面が警告。</text>
      <text x="658" y="504">人間の注意力に頼らない見張り役。</text>
    </g>

    <!-- 脚注（ページ背景の上に載るためtext変数） -->
    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
