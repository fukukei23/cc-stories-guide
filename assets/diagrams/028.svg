<!-- 素材: source/028_差分1000件の正体は作りかけの絵だった話.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s028a-title s028a-desc">
  <title id="s028a-title">謎の差分1000件の正体を仕分けと弁論で突き止めて置かない選択まで進んだ流れ</title>
  <desc id="s028a-desc">何も触っていないのに並ぶ差分1000件を実測で3種に仕分けし900枚の正体が作り直せる中間コマと突き止め、3人の代理人弁論を経てそもそも倉庫に置かない案が選ばれた6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 何も触っていないのに差分1000件（変更帯付きの差分行リスト） -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="80" y="84" width="64" height="84" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="80" y="88" width="8" height="76" fill="var(--red)"/>
    <line x1="94" y1="94" x2="136" y2="94" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="94" y1="106" x2="136" y2="106" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="94" y1="118" x2="136" y2="118" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="94" y1="130" x2="136" y2="130" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="94" y1="142" x2="130" y2="142" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="94" y1="154" x2="132" y2="154" stroke="var(--text-secondary)" stroke-width="1"/>

    <!-- パネル2: 全部を確かめて3種に仕分けた（分岐矢印+3つの箱） -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="546" y="116" width="24" height="24" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="570" y1="128" x2="588" y2="106" stroke="var(--text)" stroke-width="1.5"/>
    <line x1="570" y1="128" x2="586" y2="128" stroke="var(--text)" stroke-width="1.5"/>
    <line x1="570" y1="128" x2="588" y2="150" stroke="var(--text)" stroke-width="1.5"/>
    <rect x="590" y="94" width="22" height="18" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="588" y="120" width="22" height="18" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="590" y="146" width="22" height="18" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>

    <!-- パネル3: 900枚の正体は作り直せる中間コマ（元絵+中間コマ縦2枚+生成矢印） -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <polygon points="76,316 98,284 120,316" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="120" y1="298" x2="130" y2="298" stroke="var(--text)" stroke-width="1.5"/>
    <polygon points="130,294 136,294 136,302 130,302" fill="var(--text)"/>
    <rect x="140" y="280" width="22" height="16" rx="2" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="140" y="300" width="22" height="16" rx="2" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>

    <!-- パネル4: AI3人の代理人で弁論大会（丸3体+向かい合う吹き出し） -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="566" cy="306" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="604" cy="306" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="642" cy="306" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 574 288 l 8 -14 l 10 12" fill="none" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 636 288 l -8 -14 l -10 12" fill="none" stroke="var(--text)" stroke-width="1.3"/>

    <!-- パネル5: 「そもそも置かない」案が83点で勝つ（得点棒2本・差で圧勝を示す） -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="84" y="470" width="80" height="16" fill="var(--green)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="84" y="492" width="30" height="16" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="84" y1="512" x2="164" y2="512" stroke="var(--text)" stroke-width="1.6"/>

    <!-- パネル6: 問いが一段上がり手順を完走（上昇矢印+完了チェックリスト） -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 552 504 l 20 -20 l 12 10 l 22 -26" fill="none" stroke="var(--accent-dark)" stroke-width="2"/>
    <polygon points="604,462 596,466 602,474" fill="var(--accent-dark)"/>
    <rect x="626" y="428" width="26" height="32" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <path d="M 631 440 l 4 4 l 8 -9" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="631" y1="452" x2="647" y2="452" stroke="var(--text-secondary)" stroke-width="1"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数・両テーマ4.5:1以上） -->
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">何も触っていないのに差分1000件</text>
      <text x="658" y="106">全部を確かめて3種に仕分けた</text>
      <text x="178" y="272">900枚の正体は作り直せる中間コマ</text>
      <text x="658" y="272">AI3人の代理人で弁論大会</text>
      <text x="178" y="438">置かない案が83点で勝つ</text>
      <text x="658" y="438">問いが一段上がり手順を完走</text>
    </g>

    <!-- キャプション（2行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">作業場所を変えた途端に復活する。</text>
      <text x="178" y="172">片付ける前に正体を全部知る。</text>
      <text x="658" y="150">偽差分と誤検知とゴミの3種類。</text>
      <text x="658" y="172">実測でしか覆らない前提を確認。</text>
      <text x="178" y="316">元絵から何度でも作り直せる出力物。</text>
      <text x="178" y="338">倉庫に置く必要がそもそもない。</text>
      <text x="658" y="316">自案の悪いと認めて敗北を宣言する。</text>
      <text x="658" y="338">反論から新しい優位点が出る。</text>
      <text x="178" y="482">残す案は偽差分が本物に化けるだけ。</text>
      <text x="178" y="504">二位に24点差で置かない案が選ばれた。</text>
      <text x="658" y="482">何をしまっておくかへ問いが昇格。</text>
      <text x="658" y="504">二週間後に七ステップを完走。</text>
    </g>

    <!-- 脚注（ページ背景の上に載るためtext変数） -->
    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
