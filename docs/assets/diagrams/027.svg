<!-- 素材: source/027_宿題の答え合わせをしたら直っていたのは機械で直せるところだけだった話.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s027a-title s027a-desc">
  <title id="s027a-title">宿題の再測定で直っていたのは機械で直せるところだけと分かった流れ</title>
  <desc id="s027a-desc">6週間前の宿題10個を44回の改良のあと同じ物差しで再測定し、直っていたのは機械で直せるところだけで原因を仕事の種類と切り分け、棚の裏の外部部品の山も発見して答え合わせの型に変えた6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 六週間前の宿題を再測定する（宿題リスト紙+ループ矢印） -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="80" y="84" width="44" height="56" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="86" y1="96" x2="118" y2="96" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="86" y1="108" x2="118" y2="108" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="86" y1="120" x2="118" y2="120" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="86" y1="132" x2="112" y2="132" stroke="var(--text-secondary)" stroke-width="1"/>
    <path d="M 134 140 a 16 16 0 1 1 6 -30" fill="none" stroke="var(--accent-dark)" stroke-width="2"/>
    <polygon points="140,108 132,110 140,116" fill="var(--accent-dark)"/>

    <!-- パネル2: 半分以上がずっと凍ったまま（絡む配線+凍結箱+霜線） -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 548 88 C 574 96 574 116 548 124 M 548 88 C 574 96 574 116 548 124" fill="none" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 572 88 C 598 96 598 116 572 124" fill="none" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="606" y="92" width="34" height="34" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <g stroke="var(--text-secondary)" stroke-width="1.2">
      <line x1="606" y1="132" x2="613" y2="140"/>
      <line x1="620" y1="132" x2="627" y2="140"/>
    </g>
    <path d="M 644 130 l 10 10 M 654 130 l -10 10" fill="none" stroke="var(--red)" stroke-width="2.2"/>

    <!-- パネル3: 原因は仕事の種類にあった（機械可の緑カードと考え要の停止カード） -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="80" y="262" width="30" height="34" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <path d="M 84 274 l 4 4 l 8 -9" fill="none" stroke="var(--green)" stroke-width="2"/>
    <rect x="80" y="312" width="30" height="34" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="89" y1="324" x2="89" y2="336" stroke="var(--red)" stroke-width="2"/>
    <line x1="95" y1="324" x2="95" y2="336" stroke="var(--red)" stroke-width="2"/>
    <line x1="122" y1="279" x2="144" y2="279" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="122" y1="329" x2="144" y2="329" stroke="var(--text-secondary)" stroke-width="1.4" stroke-dasharray="4 3"/>

    <!-- パネル4: 機械で直せる所を先に片付ける（カードが単独枠へ移動） -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="548" y="264" width="28" height="32" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <path d="M 552 274 l 4 4 l 8 -9" fill="none" stroke="var(--green)" stroke-width="2"/>
    <line x1="586" y1="280" x2="610" y2="280" stroke="var(--text)" stroke-width="1.6"/>
    <polygon points="610,276 610,284 618,280" fill="var(--text)"/>
    <rect x="620" y="264" width="28" height="32" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="620" y="312" width="28" height="32" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="626" y1="328" x2="642" y2="328" stroke="var(--text-secondary)" stroke-width="1"/>

    <!-- パネル5: 棚の裏の外部部品の山を発見（棚L字+裏の箱2つ+拡大鏡） -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="76" y1="428" x2="76" y2="516" stroke="var(--text)" stroke-width="2.4"/>
    <rect x="76" y="428" width="58" height="7" fill="var(--text)"/>
    <rect x="80" y="438" width="24" height="26" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="108" y="438" width="24" height="26" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="96" y="486" width="30" height="26" rx="2" fill="var(--amber-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="146" cy="498" r="13" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.8"/>
    <line x1="156" y1="508" x2="170" y2="522" stroke="var(--text)" stroke-width="3"/>

    <!-- パネル6: 答え合わせは前回結論も疑う（物差し+前回結論紙+疑問丸+再測定矢印） -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="548" y1="424" x2="548" y2="512" stroke="var(--text)" stroke-width="3"/>
    <g stroke="var(--text)" stroke-width="1.3">
      <line x1="548" y1="436" x2="558" y2="436"/>
      <line x1="548" y1="452" x2="554" y2="452"/>
      <line x1="548" y1="468" x2="558" y2="468"/>
      <line x1="548" y1="484" x2="554" y2="484"/>
      <line x1="548" y1="500" x2="558" y2="500"/>
    </g>
    <rect x="570" y="436" width="34" height="44" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="576" y1="448" x2="598" y2="448" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="576" y1="460" x2="598" y2="460" stroke="var(--text-secondary)" stroke-width="1"/>
    <circle cx="618" cy="456" r="9" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 614 453 c 4 -4 8 0 4 3 c -2 1 -2 2 -2 3" fill="none" stroke="var(--accent-dark)" stroke-width="1.3"/>
    <circle cx="619" cy="462" r="1" fill="var(--accent-dark)"/>
    <line x1="630" y1="486" x2="656" y2="486" stroke="var(--text)" stroke-width="1.6"/>
    <polygon points="656,482 656,490 664,486" fill="var(--text)"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数・両テーマ4.5:1以上） -->
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">六週間前の宿題を再測定する</text>
      <text x="658" y="106">半分以上がずっと凍ったまま</text>
      <text x="178" y="272">原因はやる気でなく仕事の種類</text>
      <text x="658" y="272">機械で直せる所を先に片付ける</text>
      <text x="178" y="438">棚の裏の外部部品の山を発見</text>
      <text x="658" y="438">答え合わせは前回結論も疑う</text>
    </g>

    <!-- キャプション（2行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">直すべき所が10個・改良は44回。</text>
      <text x="178" y="172">同じ物差しで数え直した。</text>
      <text x="658" y="150">配線の絡みも説明書も数値が同値。</text>
      <text x="658" y="172">判断が要る物は隣に並んで埋もれる。</text>
      <text x="178" y="316">機械で直せる物と考えないと直せない物。</text>
      <text x="178" y="338">止まっていたのは考えどころだけ。</text>
      <text x="658" y="316">考えどころは単独の宿題カードに分ける。</text>
      <text x="658" y="338">埋もれずに済む分類に変わった。</text>
      <text x="178" y="482">外部製の部品は箱の中身の約7割。</text>
      <text x="178" y="504">「見ない場所」を決めていなかった。</text>
      <text x="658" y="482">直したつもりが数字で割り切れる。</text>
      <text x="658" y="504">一度やったら終わりではなくなる。</text>
    </g>

    <!-- 脚注（ページ背景の上に載るためtext変数） -->
    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
