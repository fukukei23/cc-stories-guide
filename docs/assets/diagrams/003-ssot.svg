<!-- 素材: source/003_記録してと言ったらSSOTに勝手に入る話.md -->
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s003sb-title s003sb-desc">
  <title id="s003sb-title">「記録して」一言で判断の記録が資産になる流れ</title>
  <desc id="s003sb-desc">保存場所に迷って記録が先延ばしになる状態から、「記録して」と一言投げるとスキルが保管先とタグとリンクを組み立てて日記まで連動し、判断の記録が後から辿れる資産になるまでの4段の流れ。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- 段1〜4のパネル枠 -->
    <rect x="16" y="48" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="132" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="216" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="300" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>

    <!-- 段1イラスト: 行き先が分からない記録（帳+3方向の分岐+ぼんやりした行き先） -->
    <rect x="76" y="64" width="30" height="40" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="82" y1="76" x2="100" y2="76" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="82" y1="88" x2="96" y2="88" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="110" y1="84" x2="144" y2="66" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="110" y1="84" x2="150" y2="84" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="110" y1="84" x2="144" y2="102" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="152" cy="63" r="5" fill="none" stroke="var(--text-secondary)" stroke-width="1.2"/>
    <circle cx="158" cy="84" r="5" fill="none" stroke="var(--text-secondary)" stroke-width="1.2"/>
    <circle cx="152" cy="105" r="5" fill="none" stroke="var(--text-secondary)" stroke-width="1.2"/>

    <!-- 段2イラスト: 発話の吹き出し（人+「記録して」の吹き出し） -->
    <circle cx="88" cy="155" r="13" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 72 186 Q 88 170 104 186" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="108" y="144" width="112" height="32" rx="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 116 176 L 104 190 L 132 176" fill="none" stroke="var(--text)" stroke-width="1.3"/>

    <!-- 段3イラスト: 保管先を判定して振り分ける（帳+3つの受け箱） -->
    <rect x="76" y="228" width="30" height="38" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="82" y1="240" x2="98" y2="240" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="110" y1="247" x2="136" y2="238" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="110" y1="247" x2="138" y2="247" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="110" y1="247" x2="136" y2="256" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="142" y="228" width="26" height="30" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="147" y1="238" x2="163" y2="238" stroke="var(--accent-dark)" stroke-width="1"/>
    <rect x="176" y="228" width="26" height="30" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="181" y1="238" x2="197" y2="238" stroke="var(--accent-dark)" stroke-width="1"/>
    <rect x="210" y="228" width="26" height="30" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="215" y1="238" x2="231" y2="238" stroke="var(--accent-dark)" stroke-width="1"/>

    <!-- 段4イラスト: リンクで繋がった記録が育つ（帳3個+リンク線+上向き矢印） -->
    <rect x="76" y="316" width="32" height="38" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="82" y1="328" x2="102" y2="328" stroke="var(--text-secondary)" stroke-width="1"/>
    <rect x="126" y="316" width="32" height="38" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="132" y1="328" x2="152" y2="328" stroke="var(--text-secondary)" stroke-width="1"/>
    <rect x="176" y="316" width="32" height="38" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="182" y1="328" x2="202" y2="328" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="108" y1="335" x2="126" y2="335" stroke="var(--blue)" stroke-width="1.6"/>
    <line x1="158" y1="335" x2="176" y2="335" stroke="var(--blue)" stroke-width="1.6"/>
    <line x1="226" y1="352" x2="226" y2="318" stroke="var(--blue)" stroke-width="1.8"/>
    <polygon points="220,324 232,324 226,312" fill="var(--blue)"/>
  </g>

  <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数）+ 段4緑チェック -->
  <circle cx="48" cy="81" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="165" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="249" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="333" r="16" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <path d="M 41 333 l 5 5 l 9 -11" fill="none" stroke="var(--text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="'Noto Sans JP', sans-serif">
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="86">1</text>
      <text x="48" y="170">2</text>
      <text x="48" y="254">3</text>
    </g>

    <!-- 段2の発話（吹き出し内・accent-bg変数の上にaccent-dark変数） -->
    <text x="164" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent-dark)">記録して</text>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="260" y="78">どこに残すか迷い記録が止まる</text>
      <text x="260" y="162">一言で記録の配置を任せる</text>
      <text x="260" y="246">場所とタグとリンクを組み立てる</text>
      <text x="260" y="330">判断の記録が資産として育つ</text>
    </g>

    <!-- 説明（1行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="260" y="98">メモ帳やフォルダ階層に迷って先延ばし。</text>
      <text x="260" y="182">「記録して」「SSOTに入れて」と投げる。</text>
      <text x="260" y="266">スキルが保管先を判定し日記まで連動。</text>
      <text x="260" y="350">後から自分でも意外な切り口で辿れる。</text>
    </g>
  </g>
</svg>
