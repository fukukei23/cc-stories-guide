<!-- 素材: source/053_壊れた計器を直したら戻ってきた合格が12件あった話.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s053a-title s053a-desc">
  <title id="s053a-title">広すぎた既知の失敗マーキングが眠らせていた12件の合格を回収する流れ</title>
  <desc id="s053a-desc">テスト名の部分一致で自動付与される既知の失敗扱いが広すぎて無関係な12件まで止め、直っても合格が報われない構造を完全一致とstrict化で直し、真に壊れた25件を実測で確定してからCIを赤くせずに12個の復活合格を回収した6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 既知の失敗扱いでスルー（グレーカード+先送り矢印） -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="76" y="88" width="56" height="18" rx="3" fill="var(--bg-secondary)" stroke="var(--text-secondary)" stroke-width="1.1"/>
    <rect x="76" y="112" width="56" height="18" rx="3" fill="var(--bg-secondary)" stroke="var(--text-secondary)" stroke-width="1.1"/>
    <path d="M 144 96 q 16 14 0 28" fill="none" stroke="var(--amber)" stroke-width="1.5"/>
    <polygon points="140,122 148,126 142,130" fill="var(--amber)"/>

    <!-- パネル2: 部分一致が広く12件を誤爆（広い網+×の丸） -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="552" y="92" width="92" height="18" rx="9" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.2" stroke-dasharray="5 3"/>
    <line x1="562" y1="101" x2="584" y2="101" stroke="var(--red)" stroke-width="1.6"/>
    <circle cx="566" cy="130" r="9" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <circle cx="590" cy="130" r="9" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <circle cx="614" cy="130" r="9" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <path d="M 562 126 l 7 7 M 569 126 l -7 7" stroke="var(--red)" stroke-width="1.5" fill="none"/>
    <path d="M 610 126 l 7 7 M 617 126 l -7 7" stroke="var(--red)" stroke-width="1.5" fill="none"/>

    <!-- パネル3: 直っても合格が報われない（眠る月+破線のカード） -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 88 264 a 20 20 0 1 0 18 30 a 16 16 0 0 1 -18 -30" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <rect x="128" y="280" width="44" height="26" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="136" y1="289" x2="162" y2="289" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="136" y1="298" x2="156" y2="298" stroke="var(--text-secondary)" stroke-width="1"/>

    <!-- パネル4: 完全一致で壊れた25件を確定（ふるい分け） -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <polygon points="556,262 604,262 590,286 570,286" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="572" cy="306" r="9" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <circle cx="596" cy="306" r="9" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <path d="M 592 302 l 7 7 M 599 302 l -7 7" stroke="var(--red)" stroke-width="1.6" fill="none"/>

    <!-- パネル5: 12個の復活合格を回収（起きるカード+緑チェック） -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="78" y="424" width="38" height="28" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="122" y="424" width="38" height="28" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <path d="M 85 438 l 4 4 l 8 -9" fill="none" stroke="var(--green)" stroke-width="2.2"/>
    <path d="M 129 438 l 4 4 l 8 -9" fill="none" stroke="var(--green)" stroke-width="2.2"/>

    <!-- パネル6: 推測を宣言に変えて環境が揃う（2画面+イコール線） -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="552" y="446" width="36" height="28" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="558" y1="454" x2="582" y2="454" stroke="var(--accent-dark)" stroke-width="1.4"/>
    <line x1="558" y1="463" x2="576" y2="463" stroke="var(--accent-dark)" stroke-width="1.4"/>
    <line x1="596" y1="454" x2="614" y2="454" stroke="var(--text)" stroke-width="2"/>
    <line x1="596" y1="462" x2="614" y2="462" stroke="var(--text)" stroke-width="2"/>
    <rect x="622" y="446" width="36" height="28" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="628" y1="454" x2="652" y2="454" stroke="var(--text-secondary)" stroke-width="1.4"/>
    <line x1="628" y1="463" x2="646" y2="463" stroke="var(--text-secondary)" stroke-width="1.4"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">既知の失敗扱いでスルーする運用</text>
      <text x="658" y="106">部分一致が広く12件を誤爆</text>
      <text x="178" y="272">直っても合格が報われない</text>
      <text x="658" y="272">完全一致で壊れた25件を確定</text>
      <text x="178" y="438">12個の復活合格を回収</text>
      <text x="658" y="438">推測を宣言に変えて環境が揃う</text>
    </g>

    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">失敗扱いの作り方を間違えると眠る。</text>
      <text x="178" y="172">壊れた計器で測り続けている。</text>
      <text x="658" y="150">25パターンが37テストに適用。</text>
      <text x="658" y="172">無関係な12件まで止まっていた。</text>
      <text x="178" y="316">成功しても失敗扱いのまま。</text>
      <text x="178" y="338">直したはずの合格は眠り続ける。</text>
      <text x="658" y="316">実測で確定してから解放する。</text>
      <text x="658" y="338">CIを赤くせずに済ませる。</text>
      <text x="178" y="482">改修前と全数値一致を確認。</text>
      <text x="178" y="504">復活合格が計測に顔を出す。</text>
      <text x="658" y="482">ツールの推測は環境で変わる。</text>
      <text x="658" y="504">根拠は明示的に宣言する。</text>
    </g>

    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
