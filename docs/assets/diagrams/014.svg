<!-- 素材: source/014_AIの直し提案が3体そろって否定された話.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s014a-title s014a-desc">
  <title id="s014a-title">「指紋で不可能」案が三体の点検で否定された流れ</title>
  <desc id="s014a-desc">AIの省略サボり対策の設計が人間の一言で揺さぶられ、指紋焼付けの直し案を三体のAIが別々に同じ急所で否定し、限界ごと明記した設計に組み替えた6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 頭の中だけの確認（頭+虚線の思考丸+×） -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="100" cy="112" r="16" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="100" cy="112" r="6" fill="none" stroke="var(--text-secondary)" stroke-width="1" stroke-dasharray="2 2"/>
    <path d="M 126 96 l 12 12 M 138 96 l -12 12" fill="none" stroke="var(--red)" stroke-width="2.4"/>

    <!-- パネル2: 三体のAIに弱点探し（丸3つ） -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="568" cy="112" r="11" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="600" cy="112" r="11" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="632" cy="112" r="11" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>

    <!-- パネル3: 人間の問いかけ（人+吹き出し?） -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="90" cy="286" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 74 316 Q 90 300 106 316" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="110" y="276" width="52" height="26" rx="8" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 118 302 L 108 316 L 134 302" fill="none" stroke="var(--text)" stroke-width="1.3"/>

    <!-- パネル4: 指紋焼付けの直し案（証書+指紋の渦） -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="556" y="274" width="36" height="42" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="562" y1="286" x2="584" y2="286" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="562" y1="296" x2="580" y2="296" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="596" y1="296" x2="604" y2="296" stroke="var(--text)" stroke-width="1.6"/>
    <circle cx="620" cy="296" r="10" fill="none" stroke="var(--accent-dark)" stroke-width="1.4"/>
    <circle cx="620" cy="296" r="5" fill="none" stroke="var(--accent-dark)" stroke-width="1.2"/>

    <!-- パネル5: 三体そろって同じ急所（3丸+矢印+×） -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="78" cy="440" r="9" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="100" cy="440" r="9" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="122" cy="440" r="9" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="100" y1="454" x2="100" y2="466" stroke="var(--text)" stroke-width="1.6"/>
    <polygon points="100,472 96,464 104,464" fill="var(--text)"/>
    <path d="M 92 480 l 12 12 M 104 480 l -12 12" fill="none" stroke="var(--red)" stroke-width="2.4"/>

    <!-- パネル6: 限界ごと明記の設計（文書+区切り線+緑チェック） -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="556" y="426" width="40" height="44" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="562" y1="440" x2="588" y2="440" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="560" y1="448" x2="592" y2="448" stroke="var(--accent-dark)" stroke-width="1.4" stroke-dasharray="3 2"/>
    <line x1="562" y1="456" x2="584" y2="456" stroke="var(--text-secondary)" stroke-width="1"/>
    <path d="M 606 446 l 7 7 l 14 -16" fill="none" stroke="var(--green)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数） -->
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <!-- パネル3の吹き出し内の問い（accent-bg変数の上にaccent-dark変数） -->
    <text x="136" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="var(--accent-dark)">?</text>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">AIの省略サボりがまた発覚</text>
      <text x="658" y="106">三体のAIに弱点探しを依頼</text>
      <text x="178" y="272">一言で設計が根っから揺さぶられる</text>
      <text x="658" y="272">直し案「指紋で不可能に」を出す</text>
      <text x="178" y="438">三体そろって同じ急所を突く</text>
      <text x="658" y="438">限界ごと明記した設計に組み替え</text>
    </g>

    <!-- キャプション（2行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">確認作業を頭の中でやったつもりに。</text>
      <text x="178" y="172">実際には何も見ていなかった。</text>
      <text x="658" y="150">別々のAI三体に設計案の弱点を依頼。</text>
      <text x="658" y="172">案は固まったように見えた。</text>
      <text x="178" y="316">「悪意ある偽装は本当に起こらない？」</text>
      <text x="178" y="338">人間の問いかけで揺さぶられる。</text>
      <text x="658" y="316">証拠の指紋を合言葉に焼き付ける案。</text>
      <text x="658" y="338">読まずに偽装は不可能になるはずだった。</text>
      <text x="178" y="482">指紋を取るだけでは読んだことにならない。</text>
      <text x="178" y="504">案の根幹が間違いでAIは案を取り下げ。</text>
      <text x="658" y="482">指紋は新しい設定の検知だけに限定。</text>
      <text x="658" y="504">守れる範囲と守れない範囲を明記。</text>
    </g>

    <!-- 脚注（ページ背景の上に載るため text変数を使う） -->
    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
