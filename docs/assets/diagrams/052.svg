<!-- 素材: source/052_迷子のdurable-cronが9c351486を発射していた話.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s052a-title s052a-desc">
  <title id="s052a-title">迷子のdurable-cronがゾンビだったとreconcile差分で暴く流れ</title>
  <desc id="s052a-desc">見慣れないIDの発射源がdurable cronの迷子だと分かり、定義に無い幽霊登録が発火記録の止まったゾンビcronだったことをreconcileの差分で突き止め、ghost検知強化と生存確認の監視で「触らないで回る」の境界を機械で守るようにした6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 見慣れないIDがログに散見（ログカード+怪しい行） -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="74" y="88" width="64" height="46" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="82" y1="98" x2="122" y2="98" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="82" y1="108" x2="116" y2="108" stroke="var(--amber)" stroke-width="1.6"/>
    <line x1="82" y1="118" x2="120" y2="118" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="82" y1="128" x2="112" y2="128" stroke="var(--amber)" stroke-width="1.6"/>

    <!-- パネル2: 発射源はdurable cronの群れ（時計+丸の列） -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="586" cy="98" r="14" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="586" y1="98" x2="586" y2="89" stroke="var(--text)" stroke-width="1.5"/>
    <line x1="586" y1="98" x2="593" y2="102" stroke="var(--text)" stroke-width="1.5"/>
    <circle cx="556" cy="134" r="8" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.1"/>
    <circle cx="578" cy="134" r="8" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <circle cx="600" cy="134" r="8" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.1"/>
    <circle cx="622" cy="134" r="8" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>

    <!-- パネル3: 定義に無い幽霊cron（破線の幽霊+差分の×） -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 92 260 a 13 13 0 0 1 26 0 v 22 q -4 -4 -9 0 q -4 4 -8 0 q -4 -4 -9 0 z" fill="none" stroke="var(--text-secondary)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="102" cy="262" r="2.5" fill="var(--text-secondary)"/>
    <circle cx="108" cy="262" r="2.5" fill="var(--text-secondary)"/>
    <rect x="134" y="262" width="34" height="30" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="142" y1="272" x2="160" y2="272" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="142" y1="282" x2="156" y2="282" stroke="var(--text-secondary)" stroke-width="1"/>
    <path d="M 174 272 l 9 9 M 183 272 l -9 9" stroke="var(--red)" stroke-width="1.7" fill="none"/>

    <!-- パネル4: 発火記録は止まったゾンビ（止まった時計+停止線） -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="562" cy="298" r="15" fill="none" stroke="var(--text-secondary)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="562" y1="298" x2="562" y2="288" stroke="var(--text-secondary)" stroke-width="1.5"/>
    <line x1="562" y1="298" x2="570" y2="303" stroke="var(--text-secondary)" stroke-width="1.5"/>
    <line x1="590" y1="296" x2="616" y2="296" stroke="var(--red)" stroke-width="2.6"/>
    <line x1="590" y1="304" x2="610" y2="304" stroke="var(--red)" stroke-width="2.6"/>

    <!-- パネル5: 教訓は3つ（3つの丸+小チェック） -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="86" cy="456" r="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="114" cy="456" r="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="142" cy="456" r="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <path d="M 82 456 l 3 3 l 5 -6" fill="none" stroke="var(--accent-dark)" stroke-width="1.4"/>
    <path d="M 110 456 l 3 3 l 5 -6" fill="none" stroke="var(--accent-dark)" stroke-width="1.4"/>
    <path d="M 138 456 l 3 3 l 5 -6" fill="none" stroke="var(--accent-dark)" stroke-width="1.4"/>

    <!-- パネル6: 幽霊検知と生存確認の監視（目玉+healthカード+緑チェック） -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="556" cy="462" r="14" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="556" cy="462" r="5.5" fill="var(--text)"/>
    <rect x="580" y="446" width="44" height="32" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <path d="M 588 456 l 3 3 l 6 -7" fill="none" stroke="var(--green)" stroke-width="1.6"/>
    <line x1="600" y1="457" x2="616" y2="457" stroke="var(--text-secondary)" stroke-width="1"/>
    <path d="M 588 468 l 3 3 l 6 -7" fill="none" stroke="var(--green)" stroke-width="1.6"/>
    <line x1="600" y1="469" x2="612" y2="469" stroke="var(--text-secondary)" stroke-width="1"/>
    <path d="M 636 470 l 7 8 l 15 -17" fill="none" stroke="var(--green)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">見慣れないIDがログに散見する</text>
      <text x="658" y="106">発射源はdurable cronの群れ</text>
      <text x="178" y="272">定義に無い幽霊cronが居座る</text>
      <text x="658" y="272">発火記録が止まったゾンビだった</text>
      <text x="178" y="438">沈黙するバグの教訓は3つ</text>
      <text x="658" y="438">幽霊検知と生存確認を組み込む</text>
    </g>

    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">どこが発射源なのか調べる。</text>
      <text x="178" y="172">痕跡はscriptsの配下にあった。</text>
      <text x="658" y="150">毎朝8時に走る定型ジョブ群。</text>
      <text x="658" y="172">触らないで回る完成形のはず。</text>
      <text x="178" y="316">reconcileが定義外を検出。</text>
      <text x="178" y="338">誰かが登録したまま消し忘れ。</text>
      <text x="658" y="316">apply-cronsが叫んでも動かない。</text>
      <text x="658" y="338">沈黙するバグの典型。</text>
      <text x="178" y="482">削除経路・競合・差分確認。</text>
      <text x="178" y="504">createとghostの出力を週次で。</text>
      <text x="658" y="482">境界は機械で監視するしかない。</text>
      <text x="658" y="504">health報告に生存確認が載る。</text>
    </g>

    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
