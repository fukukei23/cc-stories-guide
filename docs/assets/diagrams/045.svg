<!-- 素材: source/045_幽霊モデルという見えない故障-Nemotron死亡事象とorp.pyの3層防御.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s045a-title s045a-desc">
  <title id="s045a-title">幽霊モデルの死亡を3層防御で自動検知・補充する流れ</title>
  <desc id="s045a-desc">404で応答しない幽霊モデルが公式一覧では生存中と表示され品質が静かに下がるため、手作業のblacklistをやめて死亡スモーク・blacklist反映・新規探索の3層防御をorp.pyに押し込み、死んだのと同じ速度で補充する仕組みに置き換えた6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 3機のうち1機だけが沈黙（丸2つ+破線の幽霊丸） -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="86" cy="96" r="13" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="114" cy="96" r="13" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="142" cy="96" r="13" fill="var(--bg-card)" stroke="var(--text-secondary)" stroke-width="1.3" stroke-dasharray="3 2"/>
    <path d="M 136 91 l 6 6 M 142 91 l -6 6" stroke="var(--red)" stroke-width="1.4" fill="none"/>

    <!-- パネル2: 死を検知できないと品質が静かに下がる（減っていくバー+下矢印） -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="552" y1="88" x2="588" y2="88" stroke="var(--accent-dark)" stroke-width="5"/>
    <line x1="552" y1="102" x2="572" y2="102" stroke="var(--text-secondary)" stroke-width="5"/>
    <line x1="552" y1="116" x2="560" y2="116" stroke="var(--text-secondary)" stroke-width="5"/>
    <line x1="600" y1="90" x2="600" y2="110" stroke="var(--text)" stroke-width="1.4"/>
    <polygon points="596,108 604,108 600,116" fill="var(--text)"/>

    <!-- パネル3: 手でblacklistは次の幽霊で再発（カード+ループ矢印） -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="88" y="256" width="30" height="38" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="94" y1="268" x2="112" y2="268" stroke="var(--accent-dark)" stroke-width="1.8"/>
    <line x1="94" y1="278" x2="108" y2="278" stroke="var(--text-secondary)" stroke-width="1"/>
    <path d="M 126 270 a 14 14 0 1 1 8 10" fill="none" stroke="var(--amber)" stroke-width="1.8"/>
    <polygon points="132,282 140,286 134,290" fill="var(--amber)"/>

    <!-- パネル4: 3層防御をorp.pyに押し込めた（盾3つが縦に並ぶ） -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 552 250 l 10 -5 l 10 5 v 10 c 0 8 -10 12 -10 12 c 0 0 -10 -4 -10 -12 z" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.1"/>
    <path d="M 552 278 l 10 -5 l 10 5 v 10 c 0 8 -10 12 -10 12 c 0 0 -10 -4 -10 -12 z" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.1"/>
    <path d="M 552 306 l 10 -5 l 10 5 v 10 c 0 8 -10 12 -10 12 c 0 0 -10 -4 -10 -12 z" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.1"/>

    <!-- パネル5: 死んだのと同じ速度で補充される（破線丸→新しい丸） -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="86" cy="450" r="12" fill="var(--bg-card)" stroke="var(--text-secondary)" stroke-width="1.2" stroke-dasharray="3 2"/>
    <line x1="102" y1="450" x2="120" y2="450" stroke="var(--text)" stroke-width="1.5"/>
    <polygon points="118,446 126,450 118,454" fill="var(--text)"/>
    <circle cx="144" cy="450" r="12" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>

    <!-- パネル6: 見えない故障を見える仕組みへ（目玉+コードカード+緑チェック） -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="566" cy="460" r="15" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.5"/>
    <circle cx="566" cy="460" r="6" fill="var(--text)"/>
    <rect x="590" y="442" width="40" height="34" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="597" y1="454" x2="620" y2="454" stroke="var(--accent-dark)" stroke-width="1.6"/>
    <line x1="597" y1="464" x2="614" y2="464" stroke="var(--accent-dark)" stroke-width="1.6"/>
    <path d="M 592 486 l 9 11 l 22 -26" fill="none" stroke="var(--green)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">3機のうち1機だけが沈黙</text>
      <text x="658" y="106">死を検知できないと品質が下がる</text>
      <text x="178" y="272">手でblacklistは次の幽霊で再発</text>
      <text x="658" y="272">3層防御をorp.pyに押し込めた</text>
      <text x="178" y="438">死んだのと同じ速度で補充される</text>
      <text x="658" y="438">見えない故障を見える仕組みへ</text>
    </g>

    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">プロンプトには404で応答。</text>
      <text x="178" y="172">一覧では生存中と表示。</text>
      <text x="658" y="150">3機中2機と2機中1機の区別。</text>
      <text x="658" y="172">前提が崩れて数えられない。</text>
      <text x="178" y="316">1行修正で済む手作業。</text>
      <text x="178" y="338">幽霊が増えるたびに繰り返す。</text>
      <text x="658" y="316">死亡スモークで検知。</text>
      <text x="658" y="338">blacklist反映と新規探索。</text>
      <text x="178" y="482">free一覧から未登録を探索。</text>
      <text x="178" y="504">smoke経由で最大5件昇格。</text>
      <text x="658" y="482">手動の曖昧さがコードに映る。</text>
      <text x="658" y="504">自動昇格を実測で確認。</text>
    </g>

    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
