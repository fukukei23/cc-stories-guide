<!-- 素材: source/057_道具207個の工具箱は導入初日に鍵をかけた話.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s057a-title s057a-desc">
  <title id="s057a-title">道具207個の工具箱が導入初日に鍵をかけられるまでの流れ</title>
  <desc id="s057a-desc">話題の解析道具箱が207個の道具と毎朝全部並べる仕掛けを持っていたため、まず開けて数えてから鍵をかけて棚にしまい、普段は差し込み口で同じ能力を使い、机を空けたまま導入の作法を一つ増やした6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 新し物の工具箱 -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="82" y="106" width="72" height="34" rx="4" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 106 106 Q 118 94 130 106" fill="none" stroke="var(--text)" stroke-width="2"/>
    <line x1="82" y1="120" x2="154" y2="120" stroke="var(--text)" stroke-width="1"/>
    <line x1="72" y1="100" x2="80" y2="96" stroke="var(--amber)" stroke-width="1.5"/>
    <line x1="158" y1="100" x2="164" y2="96" stroke="var(--amber)" stroke-width="1.5"/>
    <line x1="120" y1="90" x2="120" y2="84" stroke="var(--amber)" stroke-width="1.5"/>

    <!-- パネル2: 開けて数えたら207個 -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <polygon points="564,116 574,96 628,96 638,116" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="562" y="116" width="78" height="24" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="570" y1="124" x2="604" y2="124" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="570" y1="131" x2="596" y2="131" stroke="var(--text-secondary)" stroke-width="1"/>
    <circle cx="630" cy="128" r="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.8"/>
    <line x1="637" y1="135" x2="644" y2="142" stroke="var(--text)" stroke-width="2.6"/>

    <!-- パネル3: 机が道具で塞がれる -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="76" y1="324" x2="168" y2="324" stroke="var(--text)" stroke-width="2"/>
    <line x1="84" y1="324" x2="84" y2="342" stroke="var(--text)" stroke-width="1.6"/>
    <line x1="160" y1="324" x2="160" y2="342" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="82" y="306" width="11" height="18" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1"/>
    <rect x="97" y="306" width="11" height="18" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1"/>
    <rect x="112" y="306" width="11" height="18" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1"/>
    <rect x="127" y="306" width="11" height="18" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1"/>
    <rect x="142" y="306" width="11" height="18" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1"/>
    <line x1="122" y1="284" x2="122" y2="294" stroke="var(--red)" stroke-width="1.6"/>
    <polygon points="118,293 126,293 122,301" fill="var(--red)"/>

    <!-- パネル4: 鍵をかけて棚にしまう -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="558" y="280" width="88" height="62" rx="3" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <line x1="558" y1="311" x2="646" y2="311" stroke="var(--text)" stroke-width="1.3"/>
    <rect x="576" y="290" width="52" height="19" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="602" cy="299" r="2.5" fill="var(--text)"/>
    <circle cx="610" cy="324" r="5" fill="none" stroke="var(--text)" stroke-width="1.8"/>
    <line x1="615" y1="324" x2="634" y2="324" stroke="var(--text)" stroke-width="2.4"/>
    <line x1="626" y1="324" x2="626" y2="330" stroke="var(--text)" stroke-width="2"/>
    <line x1="632" y1="324" x2="632" y2="330" stroke="var(--text)" stroke-width="2"/>

    <!-- パネル5: 普段は差し込み口 -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="84" y="406" width="10" height="30" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="84" y="436" width="10" height="14" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="80" y="450" width="18" height="8" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="126" y="406" width="10" height="30" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="126" y="436" width="10" height="14" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="122" y="450" width="18" height="8" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <path d="M 148 428 l 5 5 l 9 -11" fill="none" stroke="var(--green)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- パネル6: 空いた机と覚書の付箋 -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="556" y1="470" x2="648" y2="470" stroke="var(--text)" stroke-width="2"/>
    <line x1="564" y1="470" x2="564" y2="490" stroke="var(--text)" stroke-width="1.6"/>
    <line x1="640" y1="470" x2="640" y2="490" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="588" y="436" width="44" height="28" rx="2" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="596" y1="446" x2="624" y2="446" stroke="var(--accent-dark)" stroke-width="1.3"/>
    <line x1="596" y1="453" x2="616" y2="453" stroke="var(--accent-dark)" stroke-width="1"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">話題の工具箱がやってきた</text>
      <text x="658" y="106">開けて数えたら207個だった</text>
      <text x="178" y="272">毎朝全部並べる仕掛けだった</text>
      <text x="658" y="272">箱は鍵をかけて棚にしまう</text>
      <text x="178" y="438">普段は差し込み口で同じ工具</text>
      <text x="658" y="438">机は空いたまま能力も温存</text>
    </g>

    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">解析道具の新し物の箱。</text>
      <text x="178" y="172">置くだけで全道具が並ぶ。</text>
      <text x="658" y="150">並べる前に機械で実測。</text>
      <text x="658" y="172">説明書は壁一面3.4MB。</text>
      <text x="178" y="316">机が道具で塞がれる危機。</text>
      <text x="178" y="338">41個箱の前例で即察知。</text>
      <text x="658" y="316">登録は維持・既定は無効。</text>
      <text x="658" y="338">必要な日だけ鍵を開ける。</text>
      <text x="178" y="482">CLI直叩き・同一エンジン。</text>
      <text x="178" y="504">無効化しても何も失わない。</text>
      <text x="658" y="482">置く前に開けて数える。</text>
      <text x="658" y="504">導入の作法が一つ増えた。</text>
    </g>

    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
