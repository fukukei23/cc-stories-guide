<!-- 素材: source/021_reverse-engineer-songスキル設計の物語.md -->
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s021b-title s021b-desc">
  <title id="s021b-title">曲のURLを投げるだけで4種のプロンプト仕様書が組み上がる流れ</title>
  <desc id="s021b-desc">「いい曲だな」で止まってしまう問題を曲のURL1つで解き、見る・聴く・分析するを分離した3役が音楽・映像・静止画・テキストの4種仕様書を組み立て、聴く側から作る側に回れるまでの4段の流れ。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- 段1〜4のパネル枠 -->
    <rect x="16" y="48" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="132" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="216" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="300" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>

    <!-- 段1イラスト: MV画面+音符+停止バー -->
    <rect x="76" y="60" width="70" height="44" rx="4" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="92" cy="82" r="5" fill="none" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="97" y1="82" x2="97" y2="68" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="97" y1="68" x2="106" y2="71" stroke="var(--text)" stroke-width="1.3"/>
    <polygon points="110,74 110,90 124,82" fill="var(--accent-dark)"/>
    <line x1="152" y1="74" x2="152" y2="90" stroke="var(--red)" stroke-width="2.4"/>
    <line x1="158" y1="74" x2="158" y2="90" stroke="var(--red)" stroke-width="2.4"/>

    <!-- 段2イラスト: 人+「曲のURL」吹き出し -->
    <circle cx="88" cy="160" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 72 190 Q 88 174 104 190" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="108" y="150" width="86" height="30" rx="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 116 180 L 104 194 L 144 180" fill="none" stroke="var(--text)" stroke-width="1.3"/>

    <!-- 段3イラスト: 3役丸+4種の仕様書箱+流れ矢印 -->
    <circle cx="76" cy="238" r="9" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="98" cy="238" r="9" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="120" cy="238" r="9" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="126" y1="232" x2="140" y2="246" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="70" y="256" width="24" height="16" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="98" y="256" width="24" height="16" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="126" y="256" width="24" height="16" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="154" y="256" width="24" height="16" rx="2" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>

    <!-- 段4イラスト: 音符→矢印→手+緑チェック -->
    <circle cx="80" cy="330" r="6" fill="var(--text)"/>
    <line x1="86" y1="330" x2="86" y2="314" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="86" y1="314" x2="94" y2="317" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="104" y1="330" x2="122" y2="330" stroke="var(--text)" stroke-width="1.6"/>
    <polygon points="122,326 122,334 130,330" fill="var(--text)"/>
    <circle cx="146" cy="330" r="11" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <g stroke="var(--text)" stroke-width="1.3" fill="none">
      <line x1="141" y1="328" x2="151" y2="328"/>
      <line x1="141" y1="333" x2="151" y2="333"/>
    </g>
    <path d="M 170 324 l 8 8 l 16 -18" fill="none" stroke="var(--green)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数）+ 段4緑チェック -->
  <circle cx="48" cy="81" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="165" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="249" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="333" r="16" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <path d="M 41 333 l 5 5 l 9 -11" fill="none" stroke="var(--text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="'Noto Sans JP', sans-serif">
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="86">1</text>
      <text x="48" y="170">2</text>
      <text x="48" y="254">3</text>
    </g>

    <!-- 段2の発話（吹き出し内・accent-bg変数の上にaccent-dark変数） -->
    <text x="151" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent-dark)">曲のURL</text>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="260" y="78">MVを見ても「いい曲だな」で止まる</text>
      <text x="260" y="162">好きな曲のURLを1つ投げる</text>
      <text x="260" y="246">3役分離の分析が4種の仕様書を出す</text>
      <text x="260" y="330">「いいな」から「作れそう」へ変わる</text>
    </g>

    <!-- 説明（1行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="260" y="98">曲の仕組みも映像の作り方も読めないまま。</text>
      <text x="260" y="182">聴くだけではBPMやコード進行が取れない。</text>
      <text x="260" y="266">見る・聴く・分析を分け音楽映像静止画テキストを組み立てる。</text>
      <text x="260" y="350">完全再現でなく自分なりの別バージョンの種になる。</text>
    </g>
  </g>
</svg>
