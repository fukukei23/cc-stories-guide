<!-- 素材: source/048_毎回出る確認ダイアログの正体は使い捨てスクリプトだった.md -->
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s048b-title s048b-desc">
  <title id="s048b-title">使い捨てスクリプトを定番の道具に固定して毎回の確認を消す流れ</title>
  <desc id="s048b-desc">作業ごとの使い捨てスクリプトが権限確認ダイアログを毎回出していたため、抽出処理を固定パスの定番道具にしてallowリストへ登録し、50セッション分の無害な操作も一括で許可して毎回の確認を消した4段の流れ。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- 段1〜4のパネル枠 -->
    <rect x="16" y="48" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="132" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="216" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="300" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>

    <!-- 段1イラスト: 繰り返し出る確認ダイアログ（重なったカード2枚+ループ矢印） -->
    <rect x="76" y="72" width="64" height="30" rx="4" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="88" y="62" width="64" height="30" rx="4" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="96" y1="72" x2="138" y2="72" stroke="var(--accent-dark)" stroke-width="1.5"/>
    <line x1="96" y1="80" x2="128" y2="80" stroke="var(--accent-dark)" stroke-width="1.1"/>
    <path d="M 164 82 q 18 14 36 0" fill="none" stroke="var(--amber)" stroke-width="1.5"/>
    <polygon points="196,84 204,80 200,88" fill="var(--amber)"/>

    <!-- 段2イラスト: 人+「この道具なら通してよい」吹き出し -->
    <circle cx="88" cy="160" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 72 190 Q 88 174 104 190" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="106" y="150" width="130" height="30" rx="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 114 180 L 102 194 L 142 180" fill="none" stroke="var(--text)" stroke-width="1.3"/>

    <!-- 段3イラスト: 固定の道具カード→allowリスト（緑チェック付き行） -->
    <rect x="70" y="232" width="40" height="30" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="78" y1="242" x2="102" y2="242" stroke="var(--accent-dark)" stroke-width="1.5"/>
    <line x1="78" y1="251" x2="96" y2="251" stroke="var(--accent-dark)" stroke-width="1.1"/>
    <line x1="116" y1="247" x2="132" y2="247" stroke="var(--text)" stroke-width="1.5"/>
    <polygon points="130,243 138,247 130,251" fill="var(--text)"/>
    <rect x="142" y="228" width="56" height="38" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <path d="M 150 240 l 4 4 l 8 -9" fill="none" stroke="var(--green)" stroke-width="2"/>
    <path d="M 150 252 l 4 4 l 8 -9" fill="none" stroke="var(--green)" stroke-width="2"/>
    <line x1="168" y1="241" x2="188" y2="241" stroke="var(--text-secondary)" stroke-width="1.2"/>
    <line x1="168" y1="253" x2="184" y2="253" stroke="var(--text-secondary)" stroke-width="1.2"/>

    <!-- 段4イラスト: 消えたダイアログ（破線+×）→盾（安全も強くなる） -->
    <rect x="74" y="322" width="44" height="26" rx="4" fill="none" stroke="var(--text-secondary)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M 86 330 l 10 10 M 96 330 l -10 10" stroke="var(--red)" stroke-width="1.8" fill="none"/>
    <line x1="128" y1="335" x2="144" y2="335" stroke="var(--text)" stroke-width="1.5"/>
    <polygon points="142,331 150,335 142,339" fill="var(--text)"/>
    <path d="M 162 322 l 11 -5 l 11 5 v 11 c 0 9 -11 14 -11 14 c 0 0 -11 -5 -11 -14 z" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.2"/>
  </g>

  <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数）+ 段4緑チェック -->
  <circle cx="48" cy="81" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="165" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="249" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="333" r="16" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <path d="M 41 333 l 5 5 l 9 -11" fill="none" stroke="var(--text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="'Noto Sans JP', sans-serif">
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="86">1</text>
      <text x="48" y="170">2</text>
      <text x="48" y="254">3</text>
    </g>

    <!-- 段2の発話（吹き出し内・accent-bg変数の上にaccent-dark変数） -->
    <text x="171" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--accent-dark)">この道具は通してよい</text>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="260" y="78">作業のたびに確認ダイアログが出る</text>
      <text x="260" y="162">定番の道具をallowリストへ登録</text>
      <text x="260" y="246">固定パス化と過去50セッションの一括登録</text>
      <text x="260" y="330">毎回の確認が消え、安全も強くなる</text>
    </g>

    <!-- 説明（1行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="260" y="98">使い捨ての道具は毎回別の顔なので門番は止めるしかない。</text>
      <text x="260" y="182">使い捨てをやめて名前の決まった道具に固定する。</text>
      <text x="260" y="266">無害な操作を記録から一覧化してまとめて許可。</text>
      <text x="260" y="350">5機点検で抜け道を塞ぎテストは17本まで増える。</text>
    </g>
  </g>
</svg>
