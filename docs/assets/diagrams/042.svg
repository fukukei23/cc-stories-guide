<!-- 素材: source/042_宣言を書かないだけで全部素通りできた話.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s042a-title s042a-desc">
  <title id="s042a-title">オプトイン型の検証ゲートをfail-safe型へ逆転させた流れ</title>
  <desc id="s042a-desc">宣言を書かないだけで全ゲートを素通りできるオプトイン型の罠を実測し、宣言なしは全テスト必須のfail-safe型へ逆転、48指摘の設計収束と突破攻撃8パターンの全捕捉実証で検査対象を申告と実測の一致へ変えた6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 報告書を書いてねのゲート方式（ゲート+宣言紙が通る） -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="86" y1="82" x2="86" y2="128" stroke="var(--text)" stroke-width="2.4"/>
    <line x1="86" y1="82" x2="120" y2="82" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="94" y="92" width="28" height="34" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="100" y1="104" x2="116" y2="104" stroke="var(--accent-dark)" stroke-width="1.6"/>
    <line x1="100" y1="112" x2="112" y2="112" stroke="var(--accent-dark)" stroke-width="1.6"/>

    <!-- パネル2: 書かなければ全部素通りできた（破線ゲートを赤矢印が横切る） -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="548" y1="86" x2="548" y2="128" stroke="var(--text-secondary)" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="548" y1="86" x2="582" y2="86" stroke="var(--text-secondary)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="560" y1="128" x2="600" y2="104" stroke="var(--red)" stroke-width="1.8"/>
    <polygon points="596,100 606,104 600,112" fill="var(--red)"/>

    <!-- パネル3: オプトイン型の罠と名付けた（破線ゲートを迂回する弧） -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="104" y1="266" x2="104" y2="296" stroke="var(--text)" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="72" y1="284" x2="88" y2="284" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 88 284 q 16 -16 32 0" fill="none" stroke="var(--amber)" stroke-width="1.8"/>
    <line x1="120" y1="284" x2="140" y2="284" stroke="var(--text)" stroke-width="1.4"/>
    <polygon points="138,280 148,284 138,288" fill="var(--text)"/>

    <!-- パネル4: fail-safe型へ逆転させる（盾+チェック） -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 548 256 l 18 -8 l 18 8 v 18 c 0 14 -18 22 -18 22 c 0 0 -18 -8 -18 -22 z" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 558 268 l 6 6 l 12 -14" fill="none" stroke="var(--text)" stroke-width="2"/>

    <!-- パネル5: 3種レビュー48指摘で設計収束（レビュアー3体→決定カード） -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="84" cy="438" r="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="108" cy="430" r="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="132" cy="438" r="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="108" y1="448" x2="108" y2="460" stroke="var(--text)" stroke-width="1.4"/>
    <polygon points="104,458 112,458 108,466" fill="var(--text)"/>
    <rect x="94" y="470" width="28" height="14" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>

    <!-- パネル6: 突破攻撃8種で全捕捉を実証（攻撃線→壁→緑チェック） -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <g stroke="var(--red)" stroke-width="1.4">
      <line x1="548" y1="426" x2="562" y2="426"/>
      <line x1="548" y1="438" x2="562" y2="438"/>
      <line x1="548" y1="450" x2="562" y2="450"/>
      <line x1="548" y1="462" x2="562" y2="462"/>
    </g>
    <line x1="566" y1="418" x2="566" y2="470" stroke="var(--text)" stroke-width="2.4"/>
    <path d="M 578 438 l 10 12 l 24 -30" fill="none" stroke="var(--green)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">報告書を書いてねのゲート方式</text>
      <text x="658" y="106">書かなければ全部素通りできた</text>
      <text x="178" y="272">オプトイン型の罠と名付けた</text>
      <text x="658" y="272">fail-safe型へ逆転させる</text>
      <text x="178" y="438">3種レビュー48指摘で設計収束</text>
      <text x="658" y="438">突破攻撃8種で全捕捉を実証</text>
    </g>

    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">宣言があることを前提に設計。</text>
      <text x="178" y="172">検査は頼まれた時だけ動く。</text>
      <text x="658" y="150">フォーマット無視のセッション。</text>
      <text x="658" y="172">ゲートが発動せず完了扱い。</text>
      <text x="178" y="316">書かない選択が最速の抜け道。</text>
      <text x="178" y="338">防御は宣言行為に無かった。</text>
      <text x="658" y="316">宣言なしは全テスト必須。</text>
      <text x="658" y="338">実測と矛盾すれば差し戻す。</text>
      <text x="178" y="482">反対票も付けて人間が決定。</text>
      <text x="178" y="504">収束の自己判定をしない。</text>
      <text x="658" y="482">見逃せば設計へ戻る安全弁。</text>
      <text x="658" y="504">突破の試みをテストに使う。</text>
    </g>

    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
