<!-- 素材: source/050_URLつきでつぶやこうとしたら走り出す前に30%のリーチを捨てていた話.md -->
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s050b-title s050b-desc">
  <title id="s050b-title">走り出す前に調べた一言でリンク付き投稿の計画を組み替える流れ</title>
  <desc id="s050b-desc">自動投稿が動いた直後の一手前で「リンク付きはどう扱われる？」と調べた結果、リーチペナルティとスパム凍結のリスクが分かり、テキスト主体とスレッド宣伝への計画組み替えで予算を5分の1以下に圧縮した4段の流れ。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- 段1〜4のパネル枠 -->
    <rect x="16" y="48" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="132" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="216" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="16" y="300" width="928" height="66" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>

    <!-- 段1イラスト: 発射台のロケット+止まれの丸札 -->
    <path d="M 96 76 q 12 -14 24 0 v 18 q -12 8 -24 0 z" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <circle cx="108" cy="84" r="4" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1"/>
    <path d="M 100 96 l -4 10 M 116 96 l 4 10" stroke="var(--amber)" stroke-width="1.6" fill="none"/>
    <line x1="140" y1="86" x2="156" y2="86" stroke="var(--text-secondary)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <circle cx="174" cy="86" r="14" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.4"/>
    <line x1="167" y1="86" x2="181" y2="86" stroke="var(--red)" stroke-width="2.4"/>

    <!-- 段2イラスト: 人+「リンク付きはどうなる？」吹き出し+拡大鏡 -->
    <circle cx="86" cy="160" r="12" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 70 190 Q 86 174 102 190" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <rect x="104" y="150" width="122" height="30" rx="10" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 112 180 L 100 194 L 140 180" fill="none" stroke="var(--text)" stroke-width="1.3"/>

    <!-- 段3イラスト: 下がるリーチバー+下矢印+凍結の鍵 -->
    <line x1="84" y1="238" x2="122" y2="238" stroke="var(--accent-dark)" stroke-width="6"/>
    <line x1="84" y1="252" x2="106" y2="252" stroke="var(--text-secondary)" stroke-width="6"/>
    <line x1="84" y1="266" x2="96" y2="266" stroke="var(--red)" stroke-width="6"/>
    <line x1="136" y1="232" x2="136" y2="262" stroke="var(--red)" stroke-width="1.8"/>
    <polygon points="132,260 140,260 136,268" fill="var(--red)"/>
    <path d="M 160 254 a 5 5 0 0 1 10 0" fill="none" stroke="var(--text)" stroke-width="1.8"/>
    <rect x="158" y="254" width="14" height="11" rx="2" fill="var(--red-bg)" stroke="var(--text)" stroke-width="1.3"/>

    <!-- 段4イラスト: 旧計画の破線×→新計画の緑チェック札 -->
    <rect x="80" y="322" width="44" height="26" rx="3" fill="none" stroke="var(--text-secondary)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M 90 330 l 9 9 M 99 330 l -9 9" stroke="var(--red)" stroke-width="1.7" fill="none"/>
    <line x1="132" y1="335" x2="148" y2="335" stroke="var(--text)" stroke-width="1.5"/>
    <polygon points="146,331 154,335 146,339" fill="var(--text)"/>
    <rect x="160" y="321" width="48" height="30" rx="3" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 168 336 l 5 6 l 12 -13" fill="none" stroke="var(--green)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="190" y1="334" x2="200" y2="334" stroke="var(--text-secondary)" stroke-width="1.2"/>
    <line x1="190" y1="343" x2="196" y2="343" stroke="var(--text-secondary)" stroke-width="1.2"/>
  </g>

  <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数）+ 段4緑チェック -->
  <circle cx="48" cy="81" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="165" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="249" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <circle cx="48" cy="333" r="16" fill="var(--green-bg)" stroke="var(--text)" stroke-width="1.2"/>
  <path d="M 41 333 l 5 5 l 9 -11" fill="none" stroke="var(--text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="'Noto Sans JP', sans-serif">
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="86">1</text>
      <text x="48" y="170">2</text>
      <text x="48" y="254">3</text>
    </g>

    <!-- 段2の発話（吹き出し内・accent-bg変数の上にaccent-dark変数） -->
    <text x="165" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--accent-dark)">リンクはどう扱う？</text>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="260" y="78">「回すだけ」の一手前で止まる</text>
      <text x="260" y="162">リンク付き投稿の扱いを調べる</text>
      <text x="260" y="246">リーチの大幅減と凍結リスクが分かる</text>
      <text x="260" y="330">計画を組み替えて予算も1/5以下へ</text>
    </g>

    <!-- 説明（1行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="260" y="98">「動くことを確認」は「安全に運用できる」の証明ではない。</text>
      <text x="260" y="182">単一の情報源に頼らず複数を突き合わせる。</text>
      <text x="260" y="266">リンクを貼った瞬間に誰にも見てもらえない恐れ。</text>
      <text x="260" y="350">テキスト主体とスレッド宣伝、手動も混ぜる。</text>
    </g>
  </g>
</svg>
