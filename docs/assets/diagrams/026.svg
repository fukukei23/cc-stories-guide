<!-- 素材: source/026_ssot-record保存先の判定を機械に任せようとして構造化禁止条件を増やしすぎた話.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s026a-title s026a-desc">
  <title id="s026a-title">書込先判定を機械化した再設計が禁止条件だらけで凍結し小さな仕組みで再出発した流れ</title>
  <desc id="s026a-desc">書込先を間違える事故からスコア式の再設計を始めたが美しさの影で禁止条件が4本に増えて実装者に届かず凍結し、判断の責任分担として明示した小さな仕組みで再出発した6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 書込先を間違える事故が続く（記録紙+正と誤の分岐矢印） -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="74" y="92" width="30" height="40" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="80" y1="102" x2="98" y2="102" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="80" y1="112" x2="94" y2="112" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="106" y1="106" x2="128" y2="92" stroke="var(--green)" stroke-width="1.6"/>
    <polygon points="126,88 134,90 128,98" fill="var(--green)"/>
    <line x1="106" y1="114" x2="128" y2="132" stroke="var(--red)" stroke-width="1.6" stroke-dasharray="4 3"/>
    <polygon points="126,130 134,132 124,138" fill="var(--red)"/>
    <rect x="124" y="86" width="22" height="20" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="128" y="124" width="22" height="20" rx="2" fill="none" stroke="var(--red)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <path d="M 132 128 l 12 12 M 144 128 l -12 12" fill="none" stroke="var(--red)" stroke-width="2"/>

    <!-- パネル2: 判定を強くする再設計を思いつく（頭+ひらめき線） -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="568" cy="128" r="14" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 550 160 Q 568 144 586 160" fill="none" stroke="var(--text)" stroke-width="1.6"/>
    <circle cx="592" cy="100" r="10" fill="var(--amber-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="592" y1="86" x2="592" y2="82" stroke="var(--amber)" stroke-width="1.8"/>
    <line x1="606" y1="92" x2="611" y2="88" stroke="var(--amber)" stroke-width="1.8"/>
    <line x1="578" y1="92" x2="574" y2="88" stroke="var(--amber)" stroke-width="1.8"/>

    <!-- パネル3: スコア式を書いて「美しい」と思う（設計紙+式行と重み帯） -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="82" y="250" width="56" height="68" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="88" y1="264" x2="132" y2="264" stroke="var(--accent-dark)" stroke-width="2"/>
    <line x1="88" y1="278" x2="132" y2="278" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="88" y1="292" x2="132" y2="292" stroke="var(--accent-dark)" stroke-width="2"/>
    <line x1="88" y1="306" x2="132" y2="306" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="146" y1="286" x2="156" y2="286" stroke="var(--text)" stroke-width="2"/>
    <line x1="151" y1="281" x2="151" y2="291" stroke="var(--text)" stroke-width="2"/>

    <!-- パネル4: 影で禁止条件が4本に増える（縦棒4本+大×印） -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="560" y="284" width="10" height="56" fill="var(--text)"/>
    <rect x="582" y="276" width="10" height="64" fill="var(--text)"/>
    <rect x="604" y="288" width="10" height="52" fill="var(--text)"/>
    <rect x="626" y="280" width="10" height="60" fill="var(--text)"/>
    <line x1="552" y1="340" x2="644" y2="340" stroke="var(--text)" stroke-width="1.6"/>
    <path d="M 660 288 l 12 12 M 672 288 l -12 12" fill="none" stroke="var(--red)" stroke-width="2.6"/>

    <!-- パネル5: 実装者は「面倒」で凍結が決まる（設計書+霜線+停止バー） -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="84" y="420" width="50" height="62" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <line x1="90" y1="434" x2="128" y2="434" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="90" y1="446" x2="128" y2="446" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="90" y1="458" x2="122" y2="458" stroke="var(--text-secondary)" stroke-width="1"/>
    <g stroke="var(--text-secondary)" stroke-width="1.2">
      <line x1="84" y1="482" x2="92" y2="492"/>
      <line x1="104" y1="482" x2="112" y2="492"/>
      <line x1="124" y1="482" x2="132" y2="492"/>
    </g>
    <line x1="146" y1="440" x2="146" y2="462" stroke="var(--red)" stroke-width="2.4"/>
    <line x1="152" y1="440" x2="152" y2="462" stroke="var(--red)" stroke-width="2.4"/>

    <!-- パネル6: 責任分担の小さな仕組みで再出発（再出発矢印+小さな票+緑チェック） -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 556 508 a 22 22 0 1 1 8 -42" fill="none" stroke="var(--text)" stroke-width="2.2"/>
    <polygon points="562,462 556,474 570,472" fill="var(--text)"/>
    <rect x="596" y="456" width="26" height="30" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 602 468 l 4 4 l 8 -9" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="596" y1="476" x2="622" y2="476" stroke="var(--text-secondary)" stroke-width="1"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <!-- 番号丸（accent-bg変数塗り・文字はaccent-dark変数・両テーマ4.5:1以上） -->
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <!-- 見出し（1行・text変数） -->
    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">書込先を間違える事故が続く</text>
      <text x="658" y="106">判定を強くする再設計を思いつく</text>
      <text x="178" y="272">スコア式を書いて「美しい」と思う</text>
      <text x="658" y="272">美しさの影で禁止条件が4本に増える</text>
      <text x="178" y="438">実装者は「面倒」で凍結が決まる</text>
      <text x="658" y="438">責任分担の小さな仕組みで再出発</text>
    </g>

    <!-- キャプション（2行・パネル内側=bg-card変数背景なのでtext-secondary変数） -->
    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">「記録して」の裏で振り分けが外れる。</text>
      <text x="178" y="172">決めるのだが、ときどき間違える。</text>
      <text x="658" y="150">タグと特性カタログの照合で決める案。</text>
      <text x="658" y="172">似た場所に置けばいい素朴な発想。</text>
      <text x="178" y="316">3軸の重み付きスコア+5階層信頼度。</text>
      <text x="178" y="338">書いた瞬間が一番盛り上がる。</text>
      <text x="658" y="316">上書き・孤立・誤所・漏れの4本柱。</text>
      <text x="658" y="338">禁止の名前が節の名前より目立つ。</text>
      <text x="178" y="482">設計の美と実装の摩擦は別物。</text>
      <text x="178" y="504">読む前から「面倒」で終わる設計書。</text>
      <text x="658" y="482">禁止は確認のチェックポイントへ変わる。</text>
      <text x="658" y="504">判断の責任は人間とCCの分担で明示。</text>
    </g>

    <!-- 脚注（ページ背景の上に載るためtext変数） -->
    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
