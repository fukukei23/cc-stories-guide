<!-- 素材: source/047_補強2-4採用と4セル検証+1週間試験運用.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s047a-title s047a-desc">
  <title id="s047a-title">symlink設計の4セル全FAILから壊れる前提の安全装置へ</title>
  <desc id="s047a-desc">Windows側とWSL側で同じリポジトリをsymlinkで共通編集する設計が4セル検証で全部FAILし、cmdがUNC形式で想定外のリポジトリを解決していたことが分かったため、ReadOnly属性と30日後の再吟味リマインダーで壊れる前提の安全装置を仕込み直した6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 両側から編集するsymlink設計（家2つ+破線リンク） -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <polygon points="70,112 89,94 108,112" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="72" y="112" width="34" height="34" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="78" y1="124" x2="94" y2="124" stroke="var(--accent-dark)" stroke-width="1.4"/>
    <line x1="78" y1="134" x2="90" y2="134" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="106" y1="128" x2="126" y2="128" stroke="var(--text)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <polygon points="124,112 143,94 162,112" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="126" y="112" width="34" height="34" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="132" y1="124" x2="148" y2="124" stroke="var(--accent-dark)" stroke-width="1.4"/>
    <line x1="132" y1="134" x2="144" y2="134" stroke="var(--text-secondary)" stroke-width="1"/>

    <!-- パネル2: 3機レビューが吟味保留で一致（丸3つ+保留札） -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 548 84 a 30 12 0 0 1 72 0" fill="none" stroke="var(--amber)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <circle cx="560" cy="100" r="11" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="584" cy="100" r="11" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="608" cy="100" r="11" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="584" y1="111" x2="584" y2="124" stroke="var(--text-secondary)" stroke-width="1.2"/>
    <rect x="566" y="124" width="56" height="22" rx="3" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="574" y1="132" x2="614" y2="132" stroke="var(--accent-dark)" stroke-width="1.6"/>
    <line x1="574" y1="140" x2="606" y2="140" stroke="var(--accent-dark)" stroke-width="1.2"/>

    <!-- パネル3: 4セル検証で全部FAIL（セル4つ+×4つ+FAIL札） -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="76" y="282" width="24" height="20" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="108" y="282" width="24" height="20" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="76" y="310" width="24" height="20" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="108" y="310" width="24" height="20" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <g stroke="var(--red)" stroke-width="1.8" fill="none">
      <path d="M 82 287 l 6 6 M 88 287 l -6 6"/>
      <path d="M 114 287 l 6 6 M 120 287 l -6 6"/>
      <path d="M 82 315 l 6 6 M 88 315 l -6 6"/>
      <path d="M 114 315 l 6 6 M 120 315 l -6 6"/>
    </g>
    <rect x="80" y="342" width="48" height="18" rx="3" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.2"/>
    <line x1="88" y1="349" x2="120" y2="349" stroke="var(--red)" stroke-width="1.4"/>
    <line x1="88" y1="355" x2="112" y2="355" stroke="var(--red)" stroke-width="1.1"/>

    <!-- パネル4: cmdはUNC経路で別リポジトリに迷い込む（家→破線矢印→破線の別宅） -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <polygon points="552,286 567,272 582,286" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <rect x="554" y="286" width="26" height="28" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="584" y1="300" x2="608" y2="300" stroke="var(--amber)" stroke-width="1.6" stroke-dasharray="4 3"/>
    <polygon points="606,296 614,300 606,304" fill="var(--amber)"/>
    <polygon points="610,286 625,272 640,286" fill="none" stroke="var(--red)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="612" y="286" width="26" height="28" rx="2" fill="none" stroke="var(--red)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <path d="M 619 324 l 10 10 M 629 324 l -10 10" stroke="var(--red)" stroke-width="1.6" fill="none"/>

    <!-- パネル5: ReadOnlyの鍵+30日後の時計で包む -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <circle cx="84" cy="458" r="9" fill="none" stroke="var(--text)" stroke-width="2"/>
    <line x1="93" y1="458" x2="118" y2="458" stroke="var(--text)" stroke-width="2.2"/>
    <line x1="110" y1="458" x2="110" y2="466" stroke="var(--text)" stroke-width="2.2"/>
    <line x1="118" y1="458" x2="118" y2="466" stroke="var(--text)" stroke-width="2.2"/>
    <circle cx="138" cy="458" r="12" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="138" y1="458" x2="138" y2="450" stroke="var(--text)" stroke-width="1.6"/>
    <line x1="138" y1="458" x2="144" y2="462" stroke="var(--text)" stroke-width="1.6"/>

    <!-- パネル6: 全FAILは盲点が早く見つかった幸運（点いた電球+緑チェック） -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="560" y1="446" x2="554" y2="440" stroke="var(--amber)" stroke-width="1.6"/>
    <line x1="596" y1="446" x2="602" y2="440" stroke="var(--amber)" stroke-width="1.6"/>
    <line x1="578" y1="444" x2="578" y2="436" stroke="var(--amber)" stroke-width="1.6"/>
    <circle cx="578" cy="462" r="13" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.5"/>
    <path d="M 572 466 q 3 -5 6 0 q 3 -5 6 0" fill="none" stroke="var(--accent-dark)" stroke-width="1.4"/>
    <line x1="572" y1="477" x2="584" y2="477" stroke="var(--text)" stroke-width="2"/>
    <line x1="574" y1="481" x2="582" y2="481" stroke="var(--text)" stroke-width="1.6"/>
    <path d="M 610 466 l 7 8 l 16 -18" fill="none" stroke="var(--green)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">symlinkで両側から編集する設計</text>
      <text x="658" y="106">3機レビューが吟味保留で一致</text>
      <text x="178" y="272">4セル検証で全部FAIL</text>
      <text x="658" y="272">cmdはUNCで別の家に迷い込む</text>
      <text x="178" y="438">ReadOnlyと30日後の再吟味で包む</text>
      <text x="658" y="438">全FAILは盲点発見の幸運</text>
    </g>

    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">Windows側とWSL側で同じリポジトリ。</text>
      <text x="178" y="172">編集の摩擦を下げる狙い。</text>
      <text x="658" y="150">補強2+4の改訂案を掛ける。</text>
      <text x="658" y="172">設計の前提そのものを疑う合図。</text>
      <text x="178" y="316">cmd/PowerShell×読込/書込。</text>
      <text x="178" y="338">偶然でなく構造的な問題。</text>
      <text x="658" y="316">symlinkの向こうは別リポジトリ。</text>
      <text x="658" y="338">「同じ」は信頼できない。</text>
      <text x="178" y="482">壊れる前提の安全装置。</text>
      <text x="178" y="504">触る前に気づくことを目的に。</text>
      <text x="658" y="482">検証マトリクスで確かめる。</text>
      <text x="658" y="504">早く見つかったことが財産。</text>
    </g>

    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
