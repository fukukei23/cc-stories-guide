<!-- 素材: source/056_バージョン番号ひとつで壊れる世界.md -->
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s056a-title s056a-desc">
  <title id="s056a-title">移行手順の欠落が3名の独立指摘で構造問題だと明らかになる流れ</title>
  <desc id="s056a-desc">再起動するたびにデータが元に戻る壊れの原因が移行手順ひとつの欠落で、初歩的な案Bを負債として破棄し、設計レビューで3名が独立して履歴テーブルの欠落を指摘したことが構造の証拠になり、98個緑でも実機検証を翌日に書き残す未完の完了を学んだ6コマの物語。</desc>
  <defs>
    <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>

  <g filter="url(#sketchy)">
    <!-- パネル1: 再起動で元に戻る壊れ（DB+戻る矢印） -->
    <rect x="16" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <path d="M 88 100 h 34 v 20 c 0 5 -34 5 -34 0 z" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 88 100 c 0 -5 34 -5 34 0" fill="none" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 138 106 a 18 18 0 1 1 -4 26" fill="none" stroke="var(--red)" stroke-width="1.7" stroke-dasharray="4 3"/>
    <polygon points="136,132 128,136 136,140" fill="var(--red)"/>

    <!-- パネル2: 移行手順の欠落（箱の列+空欄の破線） -->
    <rect x="496" y="64" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="554" y="100" width="22" height="22" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="578" y="100" width="22" height="22" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="602" y="100" width="22" height="22" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="626" y="100" width="22" height="22" rx="2" fill="none" stroke="var(--red)" stroke-width="1.3" stroke-dasharray="4 3"/>

    <!-- パネル3: 初歩的な案Bは負債で破棄（カード+大×） -->
    <rect x="16" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="86" y="264" width="46" height="36" rx="3" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <line x1="94" y1="276" x2="122" y2="276" stroke="var(--text-secondary)" stroke-width="1.1"/>
    <line x1="94" y1="286" x2="118" y2="286" stroke="var(--text-secondary)" stroke-width="1.1"/>
    <path d="M 142 268 l 12 12 M 154 268 l -12 12" stroke="var(--red)" stroke-width="2.4" fill="none"/>

    <!-- パネル4: 3名の独立指摘（人3体+共通の札） -->
    <rect x="496" y="230" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="556" y="258" width="60" height="16" rx="2" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.1"/>
    <line x1="562" y1="266" x2="610" y2="266" stroke="var(--accent-dark)" stroke-width="1.3"/>
    <line x1="566" y1="274" x2="574" y2="288" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="586" y1="274" x2="586" y2="288" stroke="var(--text-secondary)" stroke-width="1"/>
    <line x1="606" y1="274" x2="598" y2="288" stroke="var(--text-secondary)" stroke-width="1"/>
    <circle cx="566" cy="296" r="8" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="586" cy="296" r="8" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="606" cy="296" r="8" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.2"/>
    <path d="M 556 314 Q 566 304 576 314" fill="none" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 576 314 Q 586 304 596 314" fill="none" stroke="var(--text)" stroke-width="1.3"/>
    <path d="M 596 314 Q 606 304 616 314" fill="none" stroke="var(--text)" stroke-width="1.3"/>

    <!-- パネル5: 98個緑でも実機は疑う（緑バー+拡大鏡） -->
    <rect x="16" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <line x1="76" y1="458" x2="126" y2="458" stroke="var(--bg-secondary)" stroke-width="9" stroke-linecap="round"/>
    <line x1="76" y1="458" x2="124" y2="458" stroke="var(--green)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="146" cy="452" r="11" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.7"/>
    <line x1="154" y1="461" x2="164" y2="471" stroke="var(--text)" stroke-width="2.6"/>

    <!-- パネル6: 欠落は構造として指摘（積み木が揃う+緑チェック） -->
    <rect x="496" y="396" width="448" height="146" rx="8" fill="var(--bg-card)" stroke="var(--text)" stroke-width="1.4"/>
    <rect x="556" y="452" width="26" height="16" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="586" y="452" width="26" height="16" rx="2" fill="var(--bg-secondary)" stroke="var(--text)" stroke-width="1.1"/>
    <rect x="571" y="432" width="26" height="16" rx="2" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.1"/>
    <path d="M 626 452 l 7 8 l 15 -17" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif">
    <circle cx="48" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="106" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="272" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="48" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <circle cx="528" cy="438" r="16" fill="var(--accent-bg)" stroke="var(--text)" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent-dark)">
      <text x="48" y="111">1</text>
      <text x="528" y="111">2</text>
      <text x="48" y="277">3</text>
      <text x="528" y="277">4</text>
      <text x="48" y="443">5</text>
      <text x="528" y="443">6</text>
    </g>

    <g font-size="16.5" font-weight="700" fill="var(--text)">
      <text x="178" y="106">17番目の朝に保存の壊れが判明</text>
      <text x="658" y="106">移行手順の欠落は履歴に無い</text>
      <text x="178" y="272">初歩的な案Bは負債で破棄</text>
      <text x="658" y="272">3名の独立指摘が構造を語る</text>
      <text x="178" y="438">98個緑でも実機はまだ疑う</text>
      <text x="658" y="438">欠落は構造として指摘される</text>
    </g>

    <g font-size="13" fill="var(--text-secondary)">
      <text x="178" y="150">画面は動くのに毎回ゼロから。</text>
      <text x="178" y="172">更新して再起動すると元に戻る。</text>
      <text x="658" y="150">1つのテーブルに全部入れるだけ。</text>
      <text x="658" y="172">移す手順はひとつも無かった。</text>
      <text x="178" y="316">バージョン1ずつでは狂っていく。</text>
      <text x="178" y="338">将来の需要を考え破棄。</text>
      <text x="658" y="316">1名は意見・3名は証拠。</text>
      <text x="658" y="338">重大5件は当日に修正。</text>
      <text x="178" y="482">緑はまだ実機で動いていない。</text>
      <text x="178" y="504">翌日の反証を書き残す。</text>
      <text x="658" y="482">問題を提起できる構造が答え。</text>
      <text x="658" y="504">動くテストとして残す。</text>
    </g>

    <text x="480" y="566" font-size="11" fill="var(--text)" text-anchor="middle">読む順: 左上から 1 → 2 → 3 → 4 → 5 → 6</text>
  </g>
</svg>
